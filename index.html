<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Os 40 cafés finalistas da Fase Nacional do Cup of Excellence Brazil 2026. Onde nascem as lendas do café especial.">
<meta property="og:type" content="website">
<meta property="og:title" content="Cup of Excellence Brazil 2026">
<meta property="og:description" content="Os 40 cafés finalistas da Fase Nacional. Onde nascem as lendas do café especial.">
<meta property="og:url" content="https://coebrazil2026.bsca.com.br/">
<meta property="og:image" content="https://coebrazil2026.bsca.com.br/brand/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="brand/icon-192.png">
<link rel="apple-touch-icon" href="brand/icon-192.png">
<link rel="canonical" href="https://coebrazil2026.bsca.com.br/">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Cup of Excellence Brazil 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Questrial&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: identidade COE Brazil 2026 — aquarela + traços dourados + cartão de papel; diretório de 40 lotes; página de fazenda; régua de patrocinadores */
:root{
  --bg:#f7f4ef; --surface:#ffffff; --ink:#1e1a24; --muted:#6e6670; --line:#e5ded3;
  --gold:#b48a3c; --gold-hi:#e2c27f; --crimson:#8e1b3a; --navy:#1d2c63; --chip:#efe9df;
  --night:#17121d; --night-ink:#f6f1e8;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --head:"Questrial", "Century Gothic", system-ui, sans-serif;
  --body:"Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --wrap:1200px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141018; --surface:#1d1822; --ink:#f0eae2; --muted:#a79fa8; --line:#342c38;
  --gold:#d9b46a; --gold-hi:#ecd29b; --crimson:#e46b86; --navy:#9fb0ea; --chip:#27202c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141018; --surface:#1d1822; --ink:#f0eae2; --muted:#a79fa8; --line:#342c38;
  --gold:#d9b46a; --gold-hi:#ecd29b; --crimson:#e46b86; --navy:#9fb0ea; --chip:#27202c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance;line-height:1.1}
.cz{font-family:var(--display);letter-spacing:.02em}
.eyebrow{font:600 12px/1.3 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--night);color:var(--night-ink);border-bottom:1px solid #d9b46a33}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{width:44px;height:auto;display:block}
.brand b{font:600 15px/1.1 var(--display);letter-spacing:.06em;white-space:nowrap}
.brand small{display:block;font:400 11px/1.2 var(--head);letter-spacing:.2em;color:var(--gold-hi)}
.lang{display:flex;border:1px solid #d9b46a66;border-radius:999px;overflow:hidden;flex:none}
.lang button{all:unset;cursor:pointer;font:600 12px/1 var(--body);letter-spacing:.1em;padding:7px 12px;color:var(--night-ink)}
.lang button[aria-pressed="true"]{background:#d9b46a;color:#17121d}

/* hero aquarela */
.hero-w{position:relative;color:#fff;background:#5a1630 url(brand/aquarela.jpg) center/cover no-repeat;overflow:hidden;isolation:isolate}
.hero-w::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#120c18cc 0%,#120c1866 48%,#120c1800 75%);z-index:-1}
.hero-w .swirl{position:absolute;top:-10px;right:-40px;width:min(62vw,760px);opacity:.95;pointer-events:none;z-index:-1}
.hero-w .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;padding-block:56px 48px;align-items:center}
.lockup{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.lockup img{width:clamp(150px,18vw,230px);height:auto;filter:drop-shadow(0 6px 18px #0006)}
.tagline{font:500 clamp(24px,3vw,38px)/1.12 var(--display);letter-spacing:.01em;text-transform:uppercase;max-width:13ch;text-shadow:0 2px 14px #0007}
.hero-w .lede{max-width:54ch;margin:26px 0 0;font-size:17px;color:#f3ece4;text-shadow:0 1px 8px #0008}
.facts{display:flex;flex-wrap:wrap;gap:12px 34px;margin-top:26px}
.facts div{border-left:1px solid #e2c27f;padding-left:12px}
.facts b{display:block;font:500 30px/1.1 var(--display);color:#fff}
.facts span{font:600 11px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#ecd8b0}
/* cartão de papel (agenda oficial) */
.paper{position:relative;background:#f4f1ec url(brand/papel.jpg) center/cover;color:#2a2430;padding:28px 28px 24px;border-radius:2px;box-shadow:0 18px 50px #0007;outline:1.5px solid #c9a35a;outline-offset:-10px}
.paper h2{font:400 30px/1 var(--display);color:#1d2c63}
.paper h2 span{display:block;font:600 13px/1.4 var(--body);letter-spacing:.22em;color:#a07a32;margin-top:6px}
.agenda{list-style:none;margin:18px 0 0;padding:0 0 0 14px;border-left:1.5px solid #c9a35a;display:grid;gap:7px;font-size:14.5px}
.agenda li{display:flex;justify-content:space-between;gap:12px}
.agenda b{font-weight:700}
.agenda li span{text-align:right;white-space:nowrap}
.agenda li.now b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8e1b3a;margin-left:7px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
.agenda li.done{color:#7a7178}
.paper .foot{margin-top:16px;font:500 11px/1.4 var(--display);letter-spacing:.12em;color:#a07a32;text-align:center}
@keyframes pulse{50%{opacity:.25}}
/* régua realização */
.regua{background:#fff;border-radius:16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 34px;padding:12px 22px 14px;box-shadow:0 10px 30px #0004}
.regua .grp{display:flex;flex-direction:column;gap:6px}
.regua .grp > span{font:700 9px/1 var(--body);letter-spacing:.18em;color:#3a3340;text-transform:uppercase}
.regua .logos{display:flex;align-items:center;gap:18px}
.regua img{height:42px;width:auto;display:block}
.regua img.apex{height:30px}
.hero-w .regua{margin-top:30px;width:max-content;max-width:100%}

/* filtros */
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:15;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{all:unset;cursor:pointer;font:400 14px/1 var(--head);padding:9px 14px;border-radius:999px;background:var(--chip);color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.tabs button small{font:600 11px/1 var(--body);color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-pressed="true"] small{color:var(--gold-hi)}
.tools select,.tools input{font:400 14px/1 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.tools input{flex:1 1 200px}
.tools .count{margin-left:auto;font:600 12px/1 var(--body);color:var(--muted)}

/* diretório */
.cat{padding-block:40px 6px}
.cat header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--gold)}
.cat h2{font:500 clamp(28px,3.4vw,40px)/1.05 var(--display)}
.cat h2 small{display:block;font:600 12px/1 var(--body);letter-spacing:.18em;color:var(--gold);margin-bottom:10px;text-transform:uppercase}
.cat header p{margin:0;color:var(--muted);max-width:56ch;font-size:14px}
.ledger{list-style:none;margin:0;padding:0}
.cols{display:grid;grid-template-columns:96px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.15fr) minmax(0,1.5fr) 80px 18px;gap:18px;align-items:center}
.row{padding:12px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .15s}
.row:hover{background:var(--surface)}
.row:hover .go{transform:translateX(3px);color:var(--crimson)}
.row:hover .farm b{color:var(--crimson)}
.row img{width:96px;height:68px;object-fit:cover;border-radius:2px;display:block;background:var(--chip)}
.row .farm b{display:block;font:400 19px/1.2 var(--head);transition:color .15s}
.row .farm span{font-size:14px;color:var(--muted)}
.row .farm .meta{display:none}
.row .k{font-size:14px;min-width:0}
.row .k small{display:block;font-size:12px;color:var(--muted)}
.row .alt{text-align:right;font:600 15px/1 var(--body)}
.row .alt small{display:block;font:600 10px/1.6 var(--body);letter-spacing:.1em;color:var(--muted)}
.go{font:400 18px/1 var(--body);color:var(--gold);transition:transform .15s}
.lhead{padding:12px 6px 8px;font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lhead span:nth-child(6){text-align:right}
.empty{padding:40px 0;color:var(--muted)}

/* patrocinadores */
.spons{margin-top:64px;background:#fff;color:#2a2430;position:relative;overflow:hidden}
.spons::after{content:"";position:absolute;right:-60px;bottom:-30px;width:340px;height:120px;background:url(brand/aquarela.jpg) 70% 60%/700px auto;border-radius:60% 40% 0 0;opacity:.9;transform:rotate(-6deg)}
.spons .wrap{position:relative;z-index:1;padding-block:52px 70px}
.spons h2{font:500 clamp(24px,2.8vw,34px)/1.1 var(--display);color:#1e1a24;text-align:center}
.spons .sub{text-align:center;color:#6e6670;margin:8px 0 34px;font-size:14px}
.tier{border-top:1px solid #c9a35a;padding-block:26px;display:grid;gap:18px}
.tier:first-of-type{border-top:0}
.tier .lab{font:600 16px/1 var(--display);letter-spacing:.06em;color:#b48a3c;text-align:center;text-transform:uppercase}
.tier .lgs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px 46px}
.tier img{display:block;width:auto}
.tier.top{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tier.top > div{display:grid;gap:16px;justify-items:center;align-content:start}
.tier.top img{height:74px}
.tier.apoio img{height:58px}
.tier.parc img{height:52px}
.tier img.ww{height:100px}.tier img.montealegre{height:80px}.tier img.coopervass{height:66px}.tier img.cropster{height:70px}.tier img.mahlkonig{height:66px}.tier img.minasul{height:62px}
.spons .regua{margin:30px auto 0;box-shadow:none;border:1px solid #e5ded3;width:max-content;max-width:100%}

/* página da fazenda */
.d-top{position:relative;color:#fff;background:#5a1630 url(brand/aquarela.jpg) center 30%/cover;isolation:isolate;overflow:hidden}
.d-top::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#120c18d9,#120c1880 60%,#120c1840);z-index:-1}
.d-top .swirl{position:absolute;left:38%;top:-40px;width:min(48vw,560px);opacity:.75;z-index:-1;pointer-events:none}
.crumbs{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:16px 6px;font-size:14px}
.crumbs a{text-decoration:none;color:#ecd8b0}.crumbs a:hover{color:#fff}
.pn{display:flex;gap:16px}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block:18px 34px}
.d-head h1{font:500 clamp(34px,5.2vw,64px)/1.04 var(--display);text-shadow:0 2px 16px #0007}
.d-head .ed{display:inline-block;margin-top:14px;font:400 15px/1 var(--head);letter-spacing:.06em;color:#17121d;background:#e2c27f;padding:7px 12px;border-radius:2px}
.d-head .loc{margin-top:12px;color:#f0e6d8}
.d-head img{width:96px;filter:drop-shadow(0 4px 12px #0007)}
.hero{aspect-ratio:21/9;width:100%;max-width:100%;object-fit:cover;display:block;background:var(--chip);margin-top:28px;border-radius:2px}
.d-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:56px;padding-block:40px}
.story h2,.sect h2{font:500 24px/1.1 var(--display);margin-bottom:16px}
.story h2::after,.sect h2::after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin-top:12px}
.story p{margin:0 0 1em;max-width:66ch;font-size:16.5px;line-height:1.75}
.rail{display:grid;gap:20px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--gold);padding:18px 20px}
.panel h3{font:600 13px/1 var(--display);letter-spacing:.12em;color:var(--gold);margin-bottom:14px;text-transform:uppercase}
.panel dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px}
.panel dt{font-size:14px;color:var(--muted)}
.panel dd{margin:0;font-size:15px;font-weight:600;text-align:right}
.panel a{color:var(--crimson)}
.score{display:flex;gap:16px;align-items:center}
.score b{font:500 40px/1 var(--display);color:var(--gold);flex:none}
.score p{margin:0;font-size:14px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px}
.gal button{all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:2px;background:var(--chip)}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.gal button:hover img{transform:scale(1.03)}
.sect{padding-block:8px 44px}
.locline{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.locline a{color:var(--crimson);font-weight:600}
.related{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{text-decoration:none;color:inherit;display:grid;gap:10px}
.card img{width:100%;aspect-ratio:3/2;max-width:100%;object-fit:cover;border-radius:2px;display:block;background:var(--chip)}
.card b{font:400 19px/1.2 var(--head)}
.card span{font-size:13px;color:var(--muted)}
.card:hover b{color:var(--crimson)}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,1400px);max-height:92vh}
dialog::backdrop{background:#000d}
dialog img{max-width:100%;max-height:86vh;display:block;margin:auto}
dialog .lb-bar{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
dialog button{all:unset;cursor:pointer;color:#fff;font:600 14px/1 var(--body);padding:8px 14px;border:1px solid #ffffff55;border-radius:999px}

footer{background:var(--night);color:#cfc5bb}
footer .wrap{display:flex;flex-wrap:wrap;gap:22px 40px;justify-content:space-between;align-items:center;padding-block:28px;font-size:14px}
footer .who{display:flex;gap:14px;align-items:center}
footer .who img{height:64px;width:auto}
footer b{color:var(--night-ink);font:600 14px/1.3 var(--display);letter-spacing:.06em}
footer .regua{box-shadow:none}
.sel{user-select:all}

@media (max-width:960px){
  .hero-w .wrap{grid-template-columns:minmax(0,1fr)}
  .hero-w::before{background:linear-gradient(180deg,#120c18b3,#120c1866 60%,#120c1833)}
  .d-grid{grid-template-columns:minmax(0,1fr);gap:32px}
  .lhead{display:none}
  .cols{grid-template-columns:80px minmax(0,1fr) 18px;gap:14px}
  .row img{width:80px;height:80px}
  .row .k,.row .alt{display:none}
  .row .farm .meta{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
  .related{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .related .card:nth-child(3){display:none}
  .tier.top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .brand b{font-size:13px}
  .lockup{gap:18px}
  .agenda li{flex-direction:column;gap:0}
  .agenda li span{text-align:left}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .hero{aspect-ratio:4/3}
  .tools{position:static}
  .tools .count{margin-left:0}
  .regua img{height:34px}.regua img.apex{height:24px}
  .tier.apoio img{height:46px}.tier.parc img{height:42px}.tier.top img{height:60px}
  .d-head img{display:none}
  .d-head{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="bar"><div class="wrap">
  <a class="brand" href="#"><img src="brand/logo-gold.png" alt=""><span><b>CUP OF EXCELLENCE</b><small>BRAZIL 2026</small></span></a>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button id="lang-pt" type="button" data-lang="pt">PT</button><button id="lang-en" type="button" data-lang="en">EN</button>
  </div>
</div></div>

<main id="app"></main>

<footer><div class="wrap">
  <div class="who"><img src="brand/bsca-reduzida.png" alt="BSCA"><div><b>BSCA</b><br><span data-t="foot1"></span><br><span class="sel">marketing@bsca.com.br</span></div></div>
  <div id="foot-regua"></div>
</div></footer>

<dialog id="lb" aria-label="Foto"><img id="lb-img" alt=""><div class="lb-bar"><button id="lb-prev" type="button">←</button><button id="lb-close" type="button">✕</button><button id="lb-next" type="button">→</button></div></dialog>

<script>
const DATA = [{"id": "fazenda-fradiques-exp", "cat": "exp", "farm": "Fazenda Fradiques", "producer": "Ana Cecília Gondim Velloso Branco", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Catuaí Amarelo", "procPt": "Experimental: Fermentação Aeróbica", "procEn": "Experimental: Aerobic Fermentation", "alt": "1.100", "histPt": "Localizada em Carmo do Paranaíba, no Cerrado Mineiro, a Fazenda São Luiz cultiva café desde 1971. Em altitudes entre 1.050 e 1.200 metros, combina experiência familiar, conhecimento acumulado ao longo das gerações e infraestrutura moderna. Da lavoura ao pós-colheita, cada etapa é conduzida com cuidado, consistência e rastreabilidade lote a lote, preservando o potencial e a identidade de cada café. Mais do que cafés especiais, a São Luiz produz cafés com origem: uma expressão singular de seu território, de suas pessoas e das escolhas que constroem sua qualidade todos os dias.", "histEn": "Located in Carmo do Paranaíba, in the Cerrado Mineiro region, Fazenda São Luiz has been growing coffee since 1971. At altitudes between 1,050 and 1,200 meters, it combines family experience, knowledge accumulated over generations and modern infrastructure. From the field to post-harvest, every stage is carried out with care, consistency and lot-by-lot traceability, preserving the potential and identity of each coffee. More than specialty coffees, São Luiz produces coffees with origin: a unique expression of its territory, its people and the choices that build its quality every day.", "site": "", "dir": "img/f00/", "imgs": [["01.jpg", 1400, 1050], ["02.jpg", 933, 1400], ["03.jpg", 1400, 771], ["04.jpg", 1400, 771], ["05.jpg", 1050, 1400]], "cover": "03.jpg"}, {"id": "fazenda-terra-de-sao-francisco-exp", "cat": "exp", "farm": "Fazenda Terra de São Francisco", "producer": "Clóvis Vieira de Melo Júnior", "region": "Mantiqueira de Minas", "city": "Carmo de Minas", "uf": "MG", "variety": "Arara", "procPt": "Fermentação Anaeróbica", "procEn": "Anaerobic Fermentation", "alt": "1.000", "histPt": "A Fazenda Terra de São Francisco nasce da busca de Clovis Mello, seu proprietário, por um caminho complementar á sua atividade primeira, o cinema. Por um propósito pessoal, ao assumir a propriedade em 2017, resolve alterar o manejo da lavoura para Orgânico e a certifica pelo IBD para BR, Europa, USA e Canadá. A partir dessa decisão a Fazenda Terra de São Francisco passa a ser gerida como um organismo vivo, que prioriza a regeneração do solo e a biodiversidade como norma perene, adotando o conceito mais puro de terroir, permitindo que, a cada safra, o solo nos surpreenda com novos aromas e um sensorial cada vez mais rico e diversificado.", "histEn": "Fazenda Terra de São Francisco was born from the search of Clovis Mello, its owner, for a path complementary to his primary activity, filmmaking. Driven by a personal purpose, upon taking over the property in 2017 he decided to convert the crop management to organic and had it certified by IBD for Brazil, Europe, the USA and Canada. From that decision on, Fazenda Terra de São Francisco has been managed as a living organism that prioritizes soil regeneration and biodiversity as a perennial standard, embracing the purest concept of terroir and allowing the soil, with each harvest, to surprise us with new aromas and an ever richer and more diverse sensory profile.", "site": "", "dir": "img/f01/", "imgs": [["01.jpg", 640, 477], ["02.jpg", 640, 477], ["03.jpg", 640, 477], ["04.jpg", 640, 357], ["05.jpg", 640, 477]], "cover": "01.jpg"}, {"id": "fazenda-cachoeira-exp", "cat": "exp", "farm": "Fazenda Cachoeira", "producer": "Denise Soares de Melo Pereira", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Paraíso", "procPt": "Experimental", "procEn": "Experimental", "alt": "1.050", "histPt": "A Fazenda Cachoeira nasceu do sonho de construir uma história no campo, tendo como pilares o trabalho familiar, a tradição e o compromisso com a qualidade. Em sua primeira geração, a fazenda vem consolidando sua trajetória com dedicação à produção agrícola, valorizando o conhecimento adquirido no dia a dia e o respeito à terra.\n\nUnindo os valores tradicionais do campo à inovação e à busca constante por excelência, a Fazenda Cachoeira trabalha para produzir cafés de qualidade, aprimorando seus processos e construindo uma identidade própria. Mais do que produzir, busca cultivar uma história pautada pelo comprometimento, pela dedicação familiar e pela paixão pelo que faz.", "histEn": "Fazenda Cachoeira was born from the dream of building a story in the countryside, founded on family work, tradition and a commitment to quality. In its first generation, the farm has been consolidating its path through dedication to agricultural production, valuing the knowledge gained day by day and respect for the land.\n\nCombining traditional rural values with innovation and the constant pursuit of excellence, Fazenda Cachoeira works to produce quality coffees, refining its processes and building its own identity. More than producing, it seeks to cultivate a story grounded in commitment, family dedication and passion for what it does.", "site": "", "dir": "img/f02/", "imgs": [["01.jpg", 1400, 936], ["02.jpg", 936, 1400], ["03.jpg", 936, 1400], ["04.jpg", 936, 1400], ["05.jpg", 1400, 936], ["06.jpg", 960, 1280]], "cover": "05.jpg"}, {"id": "fazenda-joao-do-zico-exp", "cat": "exp", "farm": "Fazenda João do Zico", "producer": "Eduardo Eustáquio de Andrade", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Arara", "procPt": "Experimental: Fermentação Anaeróbica", "procEn": "Experimental: Anaerobic Fermentation", "alt": "1.100", "histPt": "A história da Família Andrade na produção e amor pelo café se iniciou em 1901, com seus antecessores em Carmo do Paranaíba, região do alto Cerrado Mineiro, no Estado de Minas Gerais. Durante os anos 70, os irmãos Ismael Andrade e Eduardo Andrade, a terceira geração da família, reestabeleceram suas fazendas de café na região. A Fazenda João do Zico fica a 1.100 metros de altitude na zona rural de Carmo do Paranaíba e possui estações bem definidas, além de chuva e calor balanceados. A natureza faz seu trabalho, tão logo os irmãos aprenderam com seus antepassados que o mínimo a devolver para o universo é o respeito pelo meio ambiente. Por esse motivo, a sustentabilidade ambiental e a preservação da natureza são preocupações constantes na gestão da fazenda.\n\nAtualmente a gestão da propriedade é feita pelos irmãos Ismael e Eduardo Andrade, em conjunto com Rômulo Andrade, filho de Ismael e quarta geração de produtores de café da família Andrade.\n\nO trabalho de consistência e qualidade da família Andrade pode ser comprovado por prêmios de relevância internacional. Especificamente no Cup of Excellence, desde 2016, a família possui 11 winning lots, incluindo o lote campeão (1° lugar) em 2018.", "histEn": "The Andrade family's history of producing and loving coffee began in 1901, with their ancestors in Carmo do Paranaíba, in the high Cerrado Mineiro region of the state of Minas Gerais. During the 1970s, brothers Ismael Andrade and Eduardo Andrade, the family's third generation, re-established their coffee farms in the region. Fazenda João do Zico sits at 1,100 meters above sea level in the rural area of Carmo do Paranaíba and has well-defined seasons, as well as balanced rainfall and heat. Nature does its work, and the brothers learned from their ancestors that the least one can give back to the universe is respect for the environment. For this reason, environmental sustainability and the preservation of nature are constant concerns in the management of the farm.\n\nThe property is currently managed by brothers Ismael and Eduardo Andrade, together with Rômulo Andrade, Ismael's son and the fourth generation of coffee growers in the Andrade family.\n\nThe Andrade family's consistency and quality can be proven by internationally relevant awards. In the Cup of Excellence alone, since 2016, the family has had 11 winning lots, including the champion lot (1st place) in 2018.", "site": "", "dir": "img/f03/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 933], ["03.jpg", 1400, 933], ["04.jpg", 1400, 933], ["05.jpg", 1400, 788]], "cover": "01.jpg"}, {"id": "fazenda-sao-luiz-exp", "cat": "exp", "farm": "Fazenda São Luiz", "producer": "Fausto do Espírito Santo Velloso", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Catuaí Vermelho", "procPt": "Experimental: Fermentação Aeróbica", "procEn": "Experimental: Aerobic Fermentation", "alt": "1.100", "histPt": "A Fazenda São Luiz está localizada em Carmo do Paranaíba, no Cerrado Mineiro, onde produz cafés desde 1971. Em uma área privilegiada pela altitude, entre 1.050 e 1.200 metros, tradição e inovação trabalham juntas para revelar o potencial de cada lote. A experiência construída ao longo das gerações, aliada a uma estrutura moderna, permite o controle cuidadoso de todas as etapas de produção. Com consistência, rastreabilidade e atenção ao pós-colheita, a São Luiz produz cafés que carregam a identidade de sua origem e expressam, na xícara, a singularidade de seu território.", "histEn": "Fazenda São Luiz is located in Carmo do Paranaíba, in the Cerrado Mineiro region, where it has been producing coffee since 1971. In an area privileged by altitude, between 1,050 and 1,200 meters, tradition and innovation work together to reveal the potential of each lot. The experience built over generations, combined with a modern structure, allows careful control of every stage of production. With consistency, traceability and attention to post-harvest, São Luiz produces coffees that carry the identity of their origin and express, in the cup, the uniqueness of their territory.", "site": "", "dir": "img/f04/", "imgs": [["01.jpg", 787, 1400], ["02.jpg", 1400, 788], ["03.jpg", 788, 1400], ["04.jpg", 1400, 788], ["05.jpg", 1050, 1400]], "cover": "02.jpg"}, {"id": "fazenda-rio-verde-exp", "cat": "exp", "farm": "Fazenda Rio Verde", "producer": "Ipanema Agrícola S/A", "region": "Mantiqueira de Minas", "city": "Conceição do Rio Verde", "uf": "MG", "variety": "Geisha", "procPt": "Experimental: Fermentação Anaeróbica", "procEn": "Experimental: Anaerobic Fermentation", "alt": "1.260", "histPt": "Fundada em 1887 e situada no coração da Serra da Mantiqueira, a Fazenda Rio Verde representa o mais antigo tesouro agrícola da nossa empresa. Cercada por exuberantes matas intocadas, nascentes cristalinas e interligada por trilhas ecológicas, esta propriedade personifica o equilíbrio entre produção e preservação.\n\nNa Fazenda, dispomos de um amplo centro de monitoramento ambiental, onde desempenhamos uma série de atividades cruciais. Isso inclui, o rigoroso controle dos recursos hídricos, o cultivo de mudas de espécies nativas para fins de reflorestamento, a criação de abelhas silvestres e o constante acompanhamento da fauna e da flora que nos cercam. O solo desta região possui características especiais devido à sua riqueza em minerais, matéria orgânica e ao alto teor de argila, tornando-o uma das preciosidades da fazenda.\n\nCom uma equipe dedicada à incansável busca por excelência e inovação, a fazenda dispõe de uma completa e tecnológica estrutura de processamento, beneficiamento e armazenagem de café, visando a qualidade dos grãos produzidos.\n\nEste café de qualidade excepcional, foi especialmente escolhido para o Cup of Excellence devido à sua bebida prazerosa e de sabor único.", "histEn": "Founded in 1887 and set in the heart of the Serra da Mantiqueira, Fazenda Rio Verde is our company's oldest agricultural treasure. Surrounded by lush untouched forests and crystal-clear springs, and connected by ecological trails, this property embodies the balance between production and preservation.\n\nThe farm has a large environmental monitoring center, where we carry out a series of crucial activities. These include strict control of water resources, growing seedlings of native species for reforestation, raising wild bees and constantly monitoring the surrounding fauna and flora. The soil in this region has special characteristics due to its richness in minerals and organic matter and its high clay content, making it one of the farm's treasures.\n\nWith a team dedicated to the tireless pursuit of excellence and innovation, the farm has a complete, technologically advanced structure for coffee processing, milling and storage, aimed at the quality of the beans produced.\n\nThis coffee of exceptional quality was specially chosen for the Cup of Excellence for its pleasant cup and unique flavor.", "site": "", "dir": "img/f05/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 933, 1400], ["03.jpg", 1400, 933], ["04.jpg", 1280, 1280], ["05.jpg", 1400, 1050], ["06.jpg", 1400, 1050]], "cover": "01.jpg"}, {"id": "fazenda-campo-alegre-exp", "cat": "exp", "farm": "Fazenda Campo Alegre", "producer": "Jair Brás", "region": "Café da Canastra", "city": "Piumhi", "uf": "MG", "variety": "Paraíso", "procPt": "Experimental", "procEn": "Experimental", "alt": "965", "histPt": "A Fazenda Campo Alegre cultiva a tradição familiar em suas plantações, sendo administrada atualmente pela segunda e terceira geração da família.\n\nJair Brás segue os passos do pai, pioneiro na produção de café e também de leite.\n\nSem dúvidas, as heranças sanguíneas conduzem seus passos para perpetuar o legado de seu pai nas lavouras e caminhar ao lado do filho Pedro Brás (36 anos).\n\nHoje, produzem cafés especiais e exóticos em lavouras na Serra da Canastra, nos municípios de Piumhi e Vargem Bonita.\n\nSão 120 hectares da Fazenda Campo Alegre, com terreiro, secadores e toda estrutura de benefício para cultivar variedades como Rubi, Catuaí e Paraiso.\n\nAlém dos 14 hectares da Fazenda Baixadão, Casa Brás e Sítio São Pedro, com terreiro suspenso e o cultivo de variedades como Catuaí Amarelo, Catuaí Vermelho, Laurina, Geisha, Pacamara, e SL28.\n\nMineiros apaixonados por café e pela Canastra, que um dia foram presenteados com a chance de trabalhar nessas terras e hoje, contribuem ativamente para refinar a cultura cafeeira da região.\n\nA Serra da Canastra é um desses recônditos do mundo onde a essência mineira é preservada. Além de fabricar um dos melhores queijos artesanais do Brasil, é também onde se cultiva um dos melhores cafés.\n\nAlém de um terroir propício, a região conta com verdadeiros artesãos de alma simples e distintas, conectados com a terra, que cultivam o café com dedicação e admiração, em um processo simbiótico onde um é o guardião da vida do outro.\n\nCom novas tecnologias, maquinário moderno e uma nova filosofia de cultivo e comercialização, os cafés produzidos por essas famílias entraram não apenas para o mercado de cafés especiais, mas para a lista de desejo dos grandes apreciadores.\n\nSão lavouras protegidas por uma natureza exuberante e praticamente intocada que ajudam a contar a história dessas fazendas, que estão se preparando para seguir produzindo uns dos melhores cafés do país.", "histEn": "Fazenda Campo Alegre carries on family tradition in its crops and is currently managed by the second and third generations of the family. Jair Brás follows in the footsteps of his father, a pioneer in coffee and dairy production. Without a doubt, his heritage guides his steps to carry on his father's legacy in the fields, side by side with his son Pedro Brás (36).\n\nToday they produce specialty and exotic coffees on crops in the Serra da Canastra, in the municipalities of Piumhi and Vargem Bonita. Fazenda Campo Alegre spans 120 hectares, with drying patios, dryers and a full processing structure to grow varieties such as Rubi, Catuaí and Paraíso. In addition, there are the 14 hectares of Fazenda Baixadão, Casa Brás and Sítio São Pedro, with raised drying beds and varieties such as Catuaí Amarelo, Catuaí Vermelho, Laurina, Geisha, Pacamara and SL28.\n\nNatives of Minas Gerais passionate about coffee and the Canastra, who were one day given the chance to work these lands and today actively contribute to refining the region's coffee culture.\n\nSerra da Canastra is one of those hidden corners of the world where the essence of Minas Gerais is preserved. Besides making one of the best artisanal cheeses in Brazil, it is also where some of the best coffee is grown.\n\nIn addition to a favorable terroir, the region is home to true artisans with simple and distinctive souls, connected to the land, who grow coffee with dedication and admiration, in a symbiotic process in which each is the guardian of the other's life.\n\nWith new technologies, modern machinery and a new philosophy of cultivation and commercialization, the coffees produced by these families have entered not only the specialty coffee market but also the wish list of great connoisseurs.\n\nThese are crops protected by lush, practically untouched nature that help tell the story of these farms, which are preparing to keep producing some of the best coffees in the country.", "site": "", "dir": "img/f06/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 934], ["03.jpg", 1400, 934], ["04.jpg", 1395, 929], ["05.jpg", 1400, 933], ["06.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "fazenda-santa-rosa-exp", "cat": "exp", "farm": "Fazenda Santa Rosa", "producer": "Laura Alves Nunes", "region": "Cerrado Mineiro", "city": "Coromandel", "uf": "MG", "variety": "Arara", "procPt": "Experimental: Fermentação Anaeróbica", "procEn": "Experimental: Anaerobic Fermentation", "alt": "950", "histPt": "Meu avô, Osmar Pereira Nunes, criava gado de corte no Cerrado Mineiro. O café chegou pelas mãos do meu pai, Osmar Júnior, o Juninho. Em 24 de novembro de 1984, ele plantou os primeiros 10 hectares de café arábica e se tornou o primeiro cafeicultor da família. Cresci vendo essas lavouras se multiplicarem e ouvindo ele dizer que “para o produtor não existe alegria maior que chegar na fazenda e sentir o cheiro da florada”.\n\nHoje sou a segunda geração de cafeicultores da família, ao lado do meu irmão Gabriel. Na Fazenda Santa Rosa, no município de Coromandel, levo adiante o que aprendi com meu pai: cuidar do solo, renovar as lavouras, usar menos insumos e prestar atenção a cada detalhe, da planta à xícara.\n\nA altitude e o clima seco na colheita favorecem cafés de muita qualidade. O meu trabalho é tirar o melhor disso, com colheita no ponto certo, secagem cuidadosa e lotes separados com atenção.\n\nPara mim, o café é a história da minha família e o que eu quero deixar para quem vier depois. Sigo com a mesma paixão que meu pai teve em 1984, agora com um jeito próprio de fazer café.", "histEn": "My grandfather, Osmar Pereira Nunes, raised beef cattle in the Cerrado Mineiro. Coffee came through the hands of my father, Osmar Júnior, known as Juninho. On November 24, 1984, he planted the first 10 hectares of arabica coffee and became the family's first coffee grower. I grew up watching those crops multiply and hearing him say that \"for a grower, there is no greater joy than arriving at the farm and smelling the coffee blossom.\"\n\nToday I am the second generation of coffee growers in the family, alongside my brother Gabriel. At Fazenda Santa Rosa, in the municipality of Coromandel, I carry on what I learned from my father: caring for the soil, renewing the crops, using fewer inputs and paying attention to every detail, from plant to cup.\n\nThe altitude and the dry climate during harvest favor high-quality coffees. My job is to make the most of that, with harvesting at the right point, careful drying and carefully separated lots.\n\nFor me, coffee is my family's history and what I want to leave to those who come after. I carry on with the same passion my father had in 1984, now with my own way of making coffee.", "site": "", "dir": "img/f07/", "imgs": [["01.jpg", 1400, 787], ["02.jpg", 1400, 1049], ["03.jpg", 1400, 935], ["04.jpg", 1400, 933], ["05.jpg", 1400, 934], ["06.jpg", 720, 1280]], "cover": "01.jpg"}, {"id": "sitio-sao-pedro-exp", "cat": "exp", "farm": "Sítio São Pedro", "producer": "Letícia Brás", "region": "Café da Canastra", "city": "Vargem Bonita", "uf": "MG", "variety": "Geisha", "procPt": "Experimental", "procEn": "Experimental", "alt": "1.280", "histPt": "O Sítio São Pedro cultiva a tradição familiar em suas plantações, sendo administrada atualmente pela segunda e terceira geração da família.\n\nLeticia Brás segue os passos do pai Tote, cafeicultor pioneiro na região da Serra da Canastra (Centro-Oeste de Minas Gerais).\n\nSem dúvidas, as heranças sanguíneas conduzem seus passos para perpetuar o legado de seu pai nas lavouras e caminhar ao lado do filho Pedro Brás.\n\nHoje, produzem juntos cafés especiais e exóticos nas lavouras da Serra da Canastra, municípios de Piumhi e Vargem Bonita.\n\nSão 8 hectares produtivos no Sítio São Pedro, cultivando as variedades Catuai Vermelho, Geisha e SL28, além dos 7 hectares do Fazenda Baixadão e da Casa Brás, com estrutura de terreiro suspenso e o cultivo também de variedades como Catuaí Amarelo, Catuaí Vermelho, Laurina, Geisha, Pacamara, e SL28.\n\nMineiros apaixonados por café e pela Canastra, que um dia foram presenteados com a chance de trabalhar nessas terras e hoje, contribuem ativamente para refinar a cultura cafeeira da região.\n\nA Serra da Canastra é um desses recônditos do mundo onde a essência mineira é preservada. Além de fabricar um dos melhores queijos artesanais do Brasil, é também onde se cultiva um dos melhores cafés.\n\nAlém de um terroir propício, a região conta com verdadeiros artesãos de alma simples e distintas, conectados com a terra, que cultivam o café com dedicação e admiração, em um processo simbiótico onde um é o guardião da vida do outro.\n\nCom novas tecnologias, maquinário moderno e uma nova filosofia de cultivo e comercialização, os cafés produzidos por essas famílias entraram não apenas para o mercado de cafés especiais, mas para a lista de desejo dos grandes apreciadores.\n\nSão lavouras protegidas por uma natureza exuberante e praticamente intocada que ajudam a contar a história dessas fazendas, que estão se preparando para seguir produzindo uns dos melhores cafés do país.", "histEn": "Sítio São Pedro carries on family tradition in its crops and is currently managed by the second and third generations of the family. Letícia Brás follows in the footsteps of her father Tote, a pioneer coffee grower in the Serra da Canastra region (Central-West Minas Gerais). Without a doubt, her heritage guides her steps to carry on her father's legacy in the fields, side by side with her son Pedro Brás.\n\nToday, together, they produce specialty and exotic coffees on crops in the Serra da Canastra, in the municipalities of Piumhi and Vargem Bonita. Sítio São Pedro has 8 productive hectares growing Catuaí Vermelho, Geisha and SL28, in addition to the 7 hectares of Fazenda Baixadão and Casa Brás, with raised drying beds and varieties such as Catuaí Amarelo, Catuaí Vermelho, Laurina, Geisha, Pacamara and SL28.\n\nNatives of Minas Gerais passionate about coffee and the Canastra, who were one day given the chance to work these lands and today actively contribute to refining the region's coffee culture.\n\nSerra da Canastra is one of those hidden corners of the world where the essence of Minas Gerais is preserved. Besides making one of the best artisanal cheeses in Brazil, it is also where some of the best coffee is grown.\n\nIn addition to a favorable terroir, the region is home to true artisans with simple and distinctive souls, connected to the land, who grow coffee with dedication and admiration, in a symbiotic process in which each is the guardian of the other's life.\n\nWith new technologies, modern machinery and a new philosophy of cultivation and commercialization, the coffees produced by these families have entered not only the specialty coffee market but also the wish list of great connoisseurs.\n\nThese are crops protected by lush, practically untouched nature that help tell the story of these farms, which are preparing to keep producing some of the best coffees in the country.", "site": "", "dir": "img/f08/", "imgs": [["01.jpg", 1050, 1400], ["02.jpg", 1400, 933], ["03.jpg", 1400, 934], ["04.jpg", 1400, 934], ["05.jpg", 1395, 929], ["06.jpg", 1400, 933]], "cover": "02.jpg"}, {"id": "fazenda-santa-cecilia-exp", "cat": "exp", "farm": "Fazenda Santa Cecília", "producer": "Lúcio Gondim Velloso", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Paraíso", "procPt": "Experimental: Fermentação Aeróbica", "procEn": "Experimental: Aerobic Fermentation", "alt": "1.100", "histPt": "Desde 1971, a Fazenda São Luiz produz cafés em Carmo do Paranaíba, no Cerrado Mineiro. Situada entre 1.050 e 1.200 metros de altitude, a propriedade reúne tradição familiar, conhecimento técnico e infraestrutura moderna para acompanhar cada lote da lavoura ao pós-colheita. O cuidado em todas as etapas, a rastreabilidade e a busca constante por consistência permitem que cada café revele o melhor de seu potencial. O resultado são cafés especiais com identidade própria, capazes de expressar o território, as pessoas e a história da São Luiz em cada xícara.", "histEn": "Since 1971, Fazenda São Luiz has been producing coffee in Carmo do Paranaíba, in the Cerrado Mineiro region. Situated between 1,050 and 1,200 meters above sea level, the farm brings together family tradition, technical knowledge and modern infrastructure to follow each lot from the field to post-harvest. Care at every stage, traceability and the constant pursuit of consistency allow each coffee to reveal the best of its potential. The result is specialty coffees with their own identity, capable of expressing the territory, the people and the history of São Luiz in every cup.", "site": "", "dir": "img/f09/", "imgs": [["01.jpg", 788, 1400], ["02.jpg", 1400, 788], ["03.jpg", 1050, 1400], ["04.jpg", 1050, 1400], ["05.jpg", 1366, 768]], "cover": "02.jpg"}, {"id": "sitio-tres-barras-exp", "cat": "exp", "farm": "Sítio Três Barras", "producer": "Manassés Sampaio Dias", "region": "Região Vulcânica", "city": "Divinolândia", "uf": "SP", "variety": "Catucaí Amarelo", "procPt": "Experimental: Fermentação Anaeróbica", "procEn": "Experimental: Anaerobic Fermentation", "alt": "1.270", "histPt": "O Sítio Três Barras pertencia originalmente ao avô de Manassés, o Sr. José Caetano Dias, na década de 1940. Na época, a atividade predominante era o cultivo de batata. Nos anos 1950, José Caetano, que gostava de cafeicultura, plantou cerca de 5.000 pés de café, mas, como não obteve boa produtividade, a lavoura foi abandonada. Somente em 2001 o pai de Manassés, Artesio Sampaio Dias, decidiu tentar novamente. O potencial para a produção de cafés especiais foi percebido e desenvolvido em 2015. Nesse mesmo ano, Manassés participou de concursos regionais e obteve bons resultados. A parceria com a SMC abriu portas para o mercado internacional de cafés de alta qualidade.\n\nO manejo agronômico cuidadoso, até o processamento e o pós-colheita, faz com que a grande maioria dos lotes produzidos seja de qualidade superior. A colheita começa no ponto ideal de maturação, e os frutos são transportados diariamente, separados por talhão, variedade e período de colheita. O principal processo é o natural seco ao sol, com uso de terreiros suspensos para garantir uma secagem mais lenta e uniforme.", "histEn": "Sítio Três Barras originally belonged to Manassés' grandfather, Mr. José Caetano Dias, in the 1940s. At the time, the predominant activity was potato growing. In the 1950s, José Caetano, who was keen on coffee growing, planted around 5,000 coffee trees, but because he didn't get good yields, the crop was discontinued. It wasn't until 2001 that Manassés' father, Artesio Sampaio Dias, decided to give it another go. The potential for producing specialty coffees was noticed and developed in 2015. In that same year, Manassés took part in regional competitions and achieved positive results. The partnership with SMC has opened doors to the international market for high-quality coffees.\n\nCareful agronomic management, through to processing and post-harvest, means that the vast majority of the lots produced are of higher quality. Harvesting begins at the ideal stage of ripeness and the coffee cherries are transported daily, being separated by plot, variety and time of harvest. The main processing is natural sun-dried, with the use of raised beds to guarantee a slower and more even drying.", "site": "", "dir": "img/f10/", "imgs": [["01.jpg", 933, 1400], ["02.jpg", 933, 1400], ["03.jpg", 933, 1400], ["04.jpg", 1400, 933], ["05.jpg", 1400, 933], ["06.jpg", 1400, 933]], "cover": "04.jpg"}, {"id": "fazenda-palmital-exp", "cat": "exp", "farm": "Fazenda Palmital", "producer": "Rômulo Xavier Carneiro Furtado Andrade", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Paraíso", "procPt": "Experimental: Fermentação Anaeróbica", "procEn": "Experimental: Anaerobic Fermentation", "alt": "1.100", "histPt": "A história da Família Andrade na produção e amor pelo café se iniciou em 1901, com seus antecessores em Carmo do Paranaíba, região do alto Cerrado Mineiro, no Estado de Minas Gerais. Durante os anos 70, os irmãos Ismael Andrade e Eduardo Andrade, a terceira geração da família, reestabeleceram suas fazendas de café na região. A Fazenda Palmital fica a 1.100 metros de altitude na zona rural de Carmo do Paranaíba e possui estações bem definidas, além de chuva e calor balanceados. A natureza faz seu trabalho, tão logo os irmãos aprenderam com seus antepassados que o mínimo a devolver para o universo é o respeito pelo meio ambiente. Por esse motivo, a sustentabilidade ambiental e a preservação da natureza são preocupações constantes na gestão da fazenda.\n\nAtualmente a gestão da propriedade é feita pelos irmãos Ismael e Eduardo Andrade, em conjunto com Rômulo Andrade, filho de Ismael e quarta geração de produtores de café da família Andrade.\n\nO trabalho de consistência e qualidade da família Andrade pode ser comprovado por prêmios de relevância internacional. Especificamente no Cup of Excellence, desde 2016, a família possui 11 winning lots, incluindo o lote campeão (1° lugar) em 2018.", "histEn": "The Andrade family's history of producing and loving coffee began in 1901, with their ancestors in Carmo do Paranaíba, in the high Cerrado Mineiro region of the state of Minas Gerais. During the 1970s, brothers Ismael Andrade and Eduardo Andrade, the family's third generation, re-established their coffee farms in the region. Fazenda Palmital sits at 1,100 meters above sea level in the rural area of Carmo do Paranaíba and has well-defined seasons, as well as balanced rainfall and heat. Nature does its work, and the brothers learned from their ancestors that the least one can give back to the universe is respect for the environment. For this reason, environmental sustainability and the preservation of nature are constant concerns in the management of the farm.\n\nThe property is currently managed by brothers Ismael and Eduardo Andrade, together with Rômulo Andrade, Ismael's son and the fourth generation of coffee growers in the Andrade family.\n\nThe Andrade family's consistency and quality can be proven by internationally relevant awards. In the Cup of Excellence alone, since 2016, the family has had 11 winning lots, including the champion lot (1st place) in 2018.", "site": "", "dir": "img/f11/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 933], ["03.jpg", 933, 1400], ["04.jpg", 1400, 788], ["05.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "fazenda-lagoa-seca-exp", "cat": "exp", "farm": "Fazenda Lagoa Seca", "producer": "Vanda Maria Xavier Carneiro Andrade", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Arara", "procPt": "Experimental: Fermentação Anaeróbica", "procEn": "Experimental: Anaerobic Fermentation", "alt": "1.100", "histPt": "A história da Família Andrade na produção e amor pelo café se iniciou em 1901, com seus antecessores em Carmo do Paranaíba, região do alto Cerrado Mineiro, no Estado de Minas Gerais. Durante os anos 70, os irmãos Ismael Andrade e Eduardo Andrade, a terceira geração da família, reestabeleceram suas fazendas de café na região. A Fazenda Lagoa Seca fica a 1.100 metros de altitude na zona rural de Carmo do Paranaíba e possui estações bem definidas, além de chuva e calor balanceados. A natureza faz seu trabalho, tão logo os irmãos aprenderam com seus antepassados que o mínimo a devolver para o universo é o respeito pelo meio ambiente. Por esse motivo, a sustentabilidade ambiental e a preservação da natureza são preocupações constantes na gestão da fazenda.\n\nAtualmente a gestão da propriedade é feita pelos irmãos Ismael e Eduardo Andrade, em conjunto com Rômulo Andrade, filho de Ismael e quarta geração de produtores de café da família Andrade.\n\nO trabalho de consistência e qualidade da família Andrade pode ser comprovado por prêmios de relevância internacional. Especificamente no Cup of Excellence, desde 2016, a família possui 11 winning lots, incluindo o lote campeão (1° lugar) em 2018.", "histEn": "The Andrade family's history of producing and loving coffee began in 1901, with their ancestors in Carmo do Paranaíba, in the high Cerrado Mineiro region of the state of Minas Gerais. During the 1970s, brothers Ismael Andrade and Eduardo Andrade, the family's third generation, re-established their coffee farms in the region. Fazenda Lagoa Seca sits at 1,100 meters above sea level in the rural area of Carmo do Paranaíba and has well-defined seasons, as well as balanced rainfall and heat. Nature does its work, and the brothers learned from their ancestors that the least one can give back to the universe is respect for the environment. For this reason, environmental sustainability and the preservation of nature are constant concerns in the management of the farm.\n\nThe property is currently managed by brothers Ismael and Eduardo Andrade, together with Rômulo Andrade, Ismael's son and the fourth generation of coffee growers in the Andrade family.\n\nThe Andrade family's consistency and quality can be proven by internationally relevant awards. In the Cup of Excellence alone, since 2016, the family has had 11 winning lots, including the champion lot (1st place) in 2018.", "site": "", "dir": "img/f12/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 933], ["03.jpg", 1400, 933], ["04.jpg", 1400, 788], ["05.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "fazenda-eucalipto-da-serra-exp", "cat": "exp", "farm": "Fazenda Eucalipto da Serra", "producer": "Virgínia Nunes Silva Alexandrini", "region": "Cerrado Mineiro", "city": "Patrocínio", "uf": "MG", "variety": "Arara", "procPt": "Experimental: Fermentação Aeróbica", "procEn": "Experimental: Aerobic Fermentation", "alt": "1.150", "histPt": "Na Fazenda Eucalipto da Serra iniciamos o processo desde a escolha da variedade Arara, multiplicada em viveiro próprio, para que as mudas estejam ambientada ao clima e região.\n\nTemos uma biofabrica para multiplicação de agentes capazes de proteger o cafezal de uma maneira mais natural, evitando a aplicação de defensivos quimicos.\n\nA area é cercada por vegetação do Cerrado Mineiro em Reserva Legal e área de Preservação permanente.\n\nTemos um pomar diversificado e a presença constante de abelhas, passaros e animais nativos.\n\nProduzimos com consciencia e respeito ao meio ambiente.\n\nConsumimos e comercializamos alimentos com qualidade,pois faz parte da nossa identidade.\n\nO nosso café do Cerrado tem aroma e sabor, além da doçura natural.\n\nReceber o retorno positivo dos nossos clientes nos motiva a buscar cada vez mais a excelencia na produção de Cafés Especiais.\n\nE participar de concursos e ser classificado é a métrica de que estamos no caminho certo!", "histEn": "At Fazenda Eucalipto da Serra, our process starts with the choice of the Arara variety, propagated in our own nursery so that the seedlings are adapted to the local climate and region. We have a biofactory to multiply agents that protect the coffee plants in a more natural way, avoiding the use of chemical pesticides.\n\nThe area is surrounded by Cerrado vegetation in a Legal Reserve and Permanent Preservation Area. We have a diverse orchard and the constant presence of bees, birds and native animals. We produce with awareness and respect for the environment. We consume and sell quality food, because it is part of our identity.\n\nOur Cerrado coffee has aroma and flavor, as well as natural sweetness. Receiving positive feedback from our customers motivates us to keep pursuing excellence in specialty coffee production. And taking part in competitions and being ranked is the measure that we are on the right track!", "site": "", "dir": "img/f13/", "imgs": [["01.jpg", 960, 1280], ["02.jpg", 960, 1280], ["03.jpg", 960, 1280], ["04.jpg", 960, 1280], ["05.jpg", 960, 1280], ["06.jpg", 1050, 1400]], "cover": "01.jpg"}, {"id": "m-f-coffee-dry", "cat": "dry", "farm": "M&F Coffee", "producer": "Carla Poliane da Silva Oliveira", "region": "Cerrado Mineiro", "city": "Campos Altos", "uf": "MG", "variety": "Paraíso", "procPt": "Via Seca", "procEn": "Natural (Dry Process)", "alt": "1.100", "histPt": "Nossa história começa em 2001, quando dois amigos se conhecem e juntos firmam seu propósito de vida no cultivo da terra. Flávio e Marcelo, filhos de produtores rurais, já traziam a agricultura em seu DNA. Flávio, com sua vasta experiência adquirida ao longo dos anos administrando os negócios da família, encontra Marcelo, recém-formado técnico em agropecuária e destemido em explorar o universo da agricultura. Dessa união nasce uma irmandade motivada pelo cultivo da terra, pelo respeito e pela reciprocidade, valores que, ao longo dos anos, se estenderiam também às suas famílias, fortalecendo os laços e o propósito por trás desse projeto.\n\nO café é uma paixão para a maioria daqueles que vivem no Cerrado Mineiro, e não poderia ser diferente com os jovens empreendedores, nascidos e criados rodeados por lavouras de café. Em 2010, surge a oportunidade de constituírem sua primeira fazenda produtora de cafés especiais, no município de Campos Altos, Minas Gerais. Marcelo e Flávio escolheram minuciosamente cada parcela de terra onde plantariam suas lavouras, pois o propósito era produzir cafés extraordinários desde o início.\n\nAo longo dessa trajetória, o envolvimento das famílias tornou-se parte importante da construção desse sonho, compartilhando valores como dedicação, respeito à terra e compromisso com a qualidade. Nesse contexto, Carla passou a integrar essa história, acompanhando a evolução do projeto e compartilhando o propósito de construir um legado familiar ligado à produção de cafés especiais.\n\nApós uma longa jornada em busca do território perfeito, consolida-se a Bioma Café, origem onde são produzidos alguns dos cafés mais incríveis do Alto Cerrado Mineiro. Mais do que uma propriedade produtora, a Bioma representa a união entre experiência, conhecimento, paixão pela cafeicultura e um compromisso que atravessa gerações: cultivar a terra com responsabilidade e produzir cafés que expressem a identidade e o potencial de sua origem.", "histEn": "Our story begins in 2001, when two friends met and together set their life's purpose in cultivating the land. Flávio and Marcelo, sons of farmers, already had agriculture in their DNA. Flávio, with vast experience gained over the years managing the family business, met Marcelo, a newly graduated agricultural technician eager to explore the world of farming. From this union came a brotherhood driven by cultivating the land, respect and reciprocity, values that over the years would also extend to their families, strengthening the bonds and the purpose behind the project.\n\nCoffee is a passion for most of those who live in the Cerrado Mineiro, and it could not be different for these young entrepreneurs, born and raised surrounded by coffee fields. In 2010, the opportunity came to establish their first specialty coffee farm, in the municipality of Campos Altos, Minas Gerais. Marcelo and Flávio carefully chose each plot of land where they would plant their crops, since the purpose was to produce extraordinary coffees from the very beginning.\n\nAlong this journey, the families' involvement became an important part of building this dream, sharing values such as dedication, respect for the land and commitment to quality. In this context, Carla became part of the story, following the project's evolution and sharing the purpose of building a family legacy tied to specialty coffee production.\n\nAfter a long search for the perfect territory, Bioma Café was established, an origin where some of the most incredible coffees of the Alto Cerrado Mineiro are produced. More than a producing property, Bioma represents the union of experience, knowledge, passion for coffee growing and a commitment that spans generations: cultivating the land responsibly and producing coffees that express the identity and potential of their origin.", "site": "", "dir": "img/f14/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 960, 1280], ["03.jpg", 1400, 933], ["04.jpg", 1400, 933], ["05.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "fazenda-serrinha-dry", "cat": "dry", "farm": "Fazenda Serrinha", "producer": "Edivaldo Ivo dos Santos", "region": "Mantiqueira de Minas", "city": "Cristina", "uf": "MG", "variety": "Catucaí Amarelo", "procPt": "Natural", "procEn": "Natural", "alt": "1.450", "histPt": "Localizada em Cristina, MG, aos pés da Serra da Paciência, a Fazenda Serrinha foi adquirida por Edivaldo Ivo dos Santos em 2004, realizando o sonho de ter uma propriedade rural próxima à cidade. Vindo de uma família tradicional na produção de batata inglesa, Edivaldo trouxe para a cafeicultura o conhecimento e o cuidado com a terra, iniciando uma nova trajetória dedicada aos cafés especiais.\n\nCom o passar dos anos, o café ganhou protagonismo na propriedade. Há cerca de uma década, Edivaldo intensificou seu trabalho com foco na qualidade, aprimorando o manejo das lavouras e buscando as melhores práticas para expressar o potencial de cada grão. Hoje, conduz a produção ao lado do filho, com a esperança de que a próxima geração dê continuidade a essa história.\n\nDos 33,88 hectares da fazenda, 20 são dedicados ao cultivo de café, em altitudes que variam de 1.250 a 1.550 metros. A combinação de terras férteis, boa incidência solar e clima ameno favorece a maturação mais lenta e uniforme dos frutos, contribuindo para a qualidade da bebida.\n\nA propriedade cultiva variedades como Acaiá Vermelho, Catuaí Vermelho, Catucaí 24/137, Catucaí 62, Geisha e Bourbon Rosa, com produção média anual de 300 sacas e perspectiva de expansão. A colheita é manual, e os cafés passam por pré-secagem em terreiro, seguida de secagem em secador mecânico.\n\nO compromisso com a sustentabilidade também faz parte do trabalho, com a preservação das nascentes e o acompanhamento técnico do programa ATG há quatro anos, apoiando práticas responsáveis na produção de cafés especiais.\n\nEm reconhecimento a essa dedicação, a primeira colheita de uma nova área da fazenda conquistou o 9º lugar no concurso da COCARIVE, em 2025, com a variedade Catucaí 24/137.\n\nPara Edivaldo, produzir cafés especiais exige atenção a cada cafeeiro, dedicação diária e o desejo constante de aprimorar o resultado. É assim, com zelo pelo que faz e os olhos voltados para o futuro, que a Fazenda Serrinha constrói sua história na cafeicultura.", "histEn": "Located in Cristina, Minas Gerais, at the foot of the Serra da Paciência, Fazenda Serrinha was acquired by Edivaldo Ivo dos Santos in 2004, fulfilling his dream of owning a rural property close to town. Coming from a traditional potato-growing family, Edivaldo brought his knowledge and care for the land to coffee growing, starting a new path dedicated to specialty coffees.\n\nOver the years, coffee took center stage on the property. About a decade ago, Edivaldo intensified his focus on quality, improving crop management and seeking the best practices to express the potential of each bean. Today he runs production alongside his son, hoping the next generation will carry this story forward.\n\nOf the farm's 33.88 hectares, 20 are dedicated to coffee, at altitudes ranging from 1,250 to 1,550 meters. The combination of fertile soil, good sun exposure and a mild climate favors slower, more even ripening of the cherries, contributing to cup quality. The farm grows varieties such as Acaiá Vermelho, Catuaí Vermelho, Catucaí 24/137, Catucaí 62, Geisha and Bourbon Rosa, with an average annual production of 300 bags and prospects for expansion. Harvesting is done by hand, and the coffees are pre-dried on patios and then finished in mechanical dryers.\n\nCommitment to sustainability is also part of the work, with the protection of springs and four years of technical support from the ATG program, backing responsible practices in specialty coffee production. In recognition of this dedication, the first harvest from a new area of the farm took 9th place in the COCARIVE competition in 2025 with the Catucaí 24/137 variety.\n\nFor Edivaldo, producing specialty coffee requires attention to every tree, daily dedication and a constant desire to improve the result. It is in this way, with care for what he does and eyes on the future, that Fazenda Serrinha builds its story in coffee growing.", "site": "", "dir": "img/f15/", "imgs": [["01.jpg", 1400, 1050], ["02.jpg", 1400, 1050], ["03.jpg", 1400, 1050], ["04.jpg", 1400, 1050], ["05.jpg", 1050, 1400]], "cover": "01.jpg"}, {"id": "araujo-sucuri-dry", "cat": "dry", "farm": "Araújo Sucuri", "producer": "Eduardo Antônio Pires", "region": "Cerrado Mineiro", "city": "Coromandel", "uf": "MG", "variety": "Paraíso MG2", "procPt": "Via Seca", "procEn": "Natural (Dry Process)", "alt": "1.050", "histPt": "Meu nome é Eduardo Antonio Pires, sou neto e filho de cafeicultores. Em 2015, após me formar, especializar e trabalhar em diferentes setores do mercado vim definitivo do Paraná para Minas Gerais ajudar meu pai na propriedade e fazer a sucessão do negócio. Desde que cheguei sempre tive o sonho de formar uma pequena propriedade e assim começamos o Arrendamento Araújo Sucuri em julho de 2020.\n\nDe início foram vários desafios com a perfuração de poços artesianos, energia elétrica, descompactação, preparo e melhoramento do solo. Em janeiro de 2021 foi plantado o primeiro talhão de 11 hectares com as variedades Guará e Paraíso MG2, e no ano seguinte outro talhão de 12 hectares de Paraíso MG2. Feito o plantio investiu-se na infraestrutura da propriedade que quando concluídas permitiu certificações dentre elas Rain Forest, 4C, Nescafé RS Gold.\n\nAo longo desses anos a propriedade vem em busca de melhoria continua, com boas práticas trabalhistas e buscando uma agricultura sustentável onde mescla adubação química, organomineral e orgânica. Também faz uso de manejo biológico no solo e parte aérea, além do uso consciente dos recursos naturais.\n\nOs desafios não param, em 2026 foi investido em energia solar, terreiro e formação de mais um talhão de café de 11 hectares e para os próximos anos a totalidade da área.", "histEn": "My name is Eduardo Antônio Pires, and I am the grandson and son of coffee growers. In 2015, after graduating, specializing and working in different market sectors, I moved permanently from Paraná to Minas Gerais to help my father on the property and take over the business. Since I arrived, I always dreamed of building a small property, and so we started the Araújo Sucuri lease in July 2020.\n\nAt first there were many challenges: drilling artesian wells, bringing in electricity, decompacting, preparing and improving the soil. In January 2021, the first 11-hectare plot was planted with the Guará and Paraíso MG2 varieties, and the following year another 12-hectare plot of Paraíso MG2. After planting, we invested in the property's infrastructure, which, once completed, enabled certifications including Rainforest Alliance, 4C and Nescafé RS Gold.\n\nOver these years, the property has pursued continuous improvement, with good labor practices and sustainable agriculture that combines chemical, organomineral and organic fertilization. It also uses biological management of the soil and foliage, as well as conscious use of natural resources.\n\nThe challenges don't stop: in 2026 we invested in solar energy, a drying patio and a new 11-hectare coffee plot, with the rest of the area to follow in the coming years.", "site": "", "dir": "img/f16/", "imgs": [["01.jpg", 1050, 1400], ["02.jpg", 745, 1400], ["03.jpg", 1400, 819], ["04.jpg", 1400, 948], ["05.jpg", 1400, 1039]], "cover": "03.jpg"}, {"id": "fazenda-sao-luiz-dry", "cat": "dry", "farm": "Fazenda São Luiz", "producer": "Fausto do Espírito Santo Velloso", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Catuaí Vermelho", "procPt": "Via Seca: Natural", "procEn": "Natural (Dry Process)", "alt": "1.100", "histPt": "A Fazenda São Luiz está localizada em Carmo do Paranaíba, no Cerrado Mineiro, onde produz cafés desde 1971. Em uma área privilegiada pela altitude, entre 1.050 e 1.200 metros, tradição e inovação trabalham juntas para revelar o potencial de cada lote. A experiência construída ao longo das gerações, aliada a uma estrutura moderna, permite o controle cuidadoso de todas as etapas de produção. Com consistência, rastreabilidade e atenção ao pós-colheita, a São Luiz produz cafés que carregam a identidade de sua origem e expressam, na xícara, a singularidade de seu território.", "histEn": "Fazenda São Luiz is located in Carmo do Paranaíba, in the Cerrado Mineiro region, where it has been producing coffee since 1971. In an area privileged by altitude, between 1,050 and 1,200 meters, tradition and innovation work together to reveal the potential of each lot. The experience built over generations, combined with a modern structure, allows careful control of every stage of production. With consistency, traceability and attention to post-harvest, São Luiz produces coffees that carry the identity of their origin and express, in the cup, the uniqueness of their territory.", "site": "", "dir": "img/f04/", "imgs": [["01.jpg", 787, 1400], ["02.jpg", 1400, 788], ["03.jpg", 788, 1400], ["04.jpg", 1400, 788], ["05.jpg", 1050, 1400]], "cover": "02.jpg"}, {"id": "fazenda-olhos-d-agua-dry", "cat": "dry", "farm": "Fazenda Olhos D'Água", "producer": "Flávio Márcio Ferreira da Silva", "region": "Cerrado Mineiro", "city": "Campos Altos", "uf": "MG", "variety": "Arara", "procPt": "Via Seca", "procEn": "Natural (Dry Process)", "alt": "1.200", "histPt": "Sou produtor de segunda geração, iniciando com meu pai no plantio de café até os 12 anos, quando veio a falecer. Iniciei minha história aos 15 anos de idade, ajudando minha mãe e enxergando cada dia mais meu propósito de vida, praticando o cultivo da terra. Com minha vasta experiência adquirida ao longo dos anos administrando negócios da família em diversas culturas, mas sem dúvida o café é minha paixão e uma paixão para a maioria daqueles que vivem no Cerrado de Minas Gerais. Minha primeira plantação de café especial ocorreu em uma fazenda arrendada no município de Campos Altos – Minas Gerais. Vendo que meu principal propósito era produzir cafés extraordinários desde o início, hoje é uma das áreas em que produzo os cafés mais incríveis do Alto Cerrado Mineiro.", "histEn": "I am a second-generation grower. I started planting coffee with my father until I was 12, when he passed away. I began my own story at 15, helping my mother and seeing my life's purpose more clearly each day in cultivating the land. I have gained vast experience over the years managing the family business across several crops, but coffee is without a doubt my passion, as it is for most of those who live in the Cerrado of Minas Gerais. My first specialty coffee planting was on a leased farm in the municipality of Campos Altos, Minas Gerais. Since my main purpose was to produce extraordinary coffees from the very beginning, today it is one of the areas where I produce the most incredible coffees of the Alto Cerrado Mineiro.", "site": "", "dir": "img/f17/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 788], ["03.jpg", 1400, 977], ["04.jpg", 1400, 786], ["05.jpg", 1400, 788]], "cover": "01.jpg"}, {"id": "sitio-nossa-senhora-das-candeias-dry", "cat": "dry", "farm": "Sítio Nossa Senhora das Candeias", "producer": "Hilda Cândida da Silva", "region": "Mantiqueira de Minas", "city": "Cristina", "uf": "MG", "variety": "Geisha", "procPt": "Natural", "procEn": "Natural", "alt": "1.230", "histPt": "Nas montanhas da Serra da Mantiqueira, em Cristina, Minas Gerais, o Sítio Nossa Senhora das Candeias carrega uma história de dedicação, tradição familiar e amor pelo café. À frente dessa trajetória está Hilda Cândida da Silva, uma produtora que representa a força da agricultura familiar e o compromisso com a qualidade.\n\nPara Hilda, produzir café vai muito além do cultivo. É um trabalho que exige paciência, conhecimento e cuidado em cada etapa, desde os tratos da lavoura até a colheita e o pós-colheita. Cada safra traz novos desafios, exigindo atenção ao clima, ao tempo de maturação dos frutos e aos processos que ajudam a revelar o melhor de cada grão.\n\nInserido na tradição cafeeira de Cristina e da Serra da Mantiqueira, o sítio representa a evolução de uma produção que valoriza a origem, a seleção dos frutos e os cuidados necessários para produzir cafés especiais. O trabalho de Hilda também se relaciona ao reconhecimento crescente dos cafés da região em concursos de qualidade.\n\nMais do que pontuações e premiações, sua história é construída diariamente pelas mãos de quem conhece a terra e compreende o valor de cada safra. É a história de uma mulher que transforma dedicação em qualidade e mantém viva a essência da produção familiar.\n\nO Sítio Nossa Senhora das Candeias é a expressão do trabalho, da perseverança e da paixão de Hilda Cândida da Silva pelo café.Em cada grão, carrega um pouco de sua história e da identidade das montanhas da Mantiqueira, levando à xícara o resultado de uma relação construída com a terra, geração após geração.", "histEn": "In the mountains of the Serra da Mantiqueira, in Cristina, Minas Gerais, Sítio Nossa Senhora das Candeias carries a story of dedication, family tradition and love for coffee. Leading this journey is Hilda Cândida da Silva, a grower who represents the strength of family farming and a commitment to quality.\n\nFor Hilda, producing coffee goes far beyond cultivation. It is work that demands patience, knowledge and care at every stage, from crop management to harvest and post-harvest. Each harvest brings new challenges, requiring attention to the weather, the ripening time of the cherries and the processes that help reveal the best of each bean.\n\nRooted in the coffee tradition of Cristina and the Serra da Mantiqueira, the farm represents the evolution of a production that values origin, cherry selection and the care needed to produce specialty coffees. Hilda's work is also linked to the growing recognition of the region's coffees in quality competitions.\n\nMore than scores and awards, her story is built daily by the hands of someone who knows the land and understands the value of each harvest. It is the story of a woman who turns dedication into quality and keeps the essence of family farming alive.\n\nSítio Nossa Senhora das Candeias is the expression of Hilda Cândida da Silva's work, perseverance and passion for coffee. Each bean carries a bit of her story and of the identity of the Mantiqueira mountains, bringing to the cup the result of a relationship with the land built generation after generation.", "site": "", "dir": "img/f18/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 934], ["03.jpg", 1280, 854], ["04.jpg", 1400, 934], ["05.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "sitio-bela-vista-dry", "cat": "dry", "farm": "Sítio Bela Vista", "producer": "Jarbas Cleto Lopes", "region": "Mantiqueira de Minas", "city": "São Gonçalo do Sapucaí", "uf": "MG", "variety": "Arara", "procPt": "Via Seca: Natural", "procEn": "Natural (Dry Process)", "alt": "1.270", "histPt": "De origens rurais, Jarbas, casado com Vera, consegue a realização de um sonho: adquirir uma propriedade e dedicar-se às lidas rurais. Dadas as condições de altitude, solo e clima, optamos pela produção de café e em 1988 foi implantado o primeiro talhão de Catuaí Amarelo. Já em 1990, com intuito de produzir com qualidade, iniciamos melhorias da infra-estrutura, depósito para materiais e terreiro de terra. Anos seguintes, concretamos terreiro e adquirimos lavador, secador e máquina para beneficio. Foram plantados outras variedades como Acaiá, Catucaí, Icatú, Rubí. Em 2000 iniciamos processo de Reserva Legal, devidamente averbada. Já em 2008 conseguimos a primeira certificação Certificação Minas, Depois o Fair Trade, através da Ass.dos Produtores Do Alto da Serra- APAS, seguindo aprimorando boas práticas de produção, melhorias da qualidade e sustentabilidade, proteção do meio ambiente, as nascentes, as pessoas, a natureza. Atualmente temos alguns talhões Orgânicos, certificadora Ecocert. Os cafés do Sítio Bela Vista, no decorrer das safras, foram premiados em vários concursos de qualidade, COE EDIÇÃO 011/12, Coccamig, Coopervass, Minasul e outros.", "histEn": "With rural roots, Jarbas, married to Vera, fulfilled a dream: acquiring a property and dedicating himself to farm work. Given the altitude, soil and climate conditions, we chose to produce coffee, and in 1988 the first plot of Catuaí Amarelo was planted. In 1990, aiming to produce with quality, we began improving the infrastructure, with a storage shed and an earthen drying patio. In the following years, we paved the patio and acquired a washer, a dryer and a hulling machine. Other varieties were planted, such as Acaiá, Catucaí, Icatu and Rubi. In 2000 we began the Legal Reserve process, duly registered. In 2008 we obtained our first certification, Certifica Minas, followed by Fair Trade through the Associação dos Produtores do Alto da Serra (APAS), continuing to improve good production practices, quality and sustainability, protecting the environment, the springs, the people and nature. We currently have some organic plots, certified by Ecocert. Over the harvests, Sítio Bela Vista's coffees have won awards in several quality competitions, including the Cup of Excellence 2011/12, Coccamig, Coopervass, Minasul and others.", "site": "", "dir": "img/f19/", "imgs": [["01.jpg", 1400, 788], ["02.jpg", 787, 1400], ["03.jpg", 1400, 1050], ["04.jpg", 1280, 412], ["05.jpg", 1400, 788]], "cover": "01.jpg"}, {"id": "chacara-uniao-dry", "cat": "dry", "farm": "Chácara União", "producer": "João Florentino Barbosa", "region": "Chapada Diamantina", "city": "Piatã", "uf": "BA", "variety": "Arara", "procPt": "Natural", "procEn": "Natural", "alt": "1.320", "histPt": "A história da Chácara União é marcada pela tradição familiar, pelo amor à terra e pela busca constante pela excelência na produção de cafés especiais. Localizada em Piatã, na Chapada Diamantina, a propriedade carrega um legado de gerações dedicado à cafeicultura de qualidade.\n\nCom mais de 80 anos de tradição familiar, João Florentino Barbosa dedicou mais de 35 anos à produção comercial de café. Em 2003, iniciou uma nova etapa de sua trajetória, direcionando seus esforços à produção de cafés especiais e investindo no aprimoramento dos processos produtivos e na valorização da qualidade.\n\nO reconhecimento chegou em 2010, quando a Chácara União conquistou a 10ª colocação no Cup of Excellence, um dos mais prestigiados concursos de cafés especiais do mundo. Essa conquista marcou a história da propriedade e evidenciou o potencial dos cafés produzidos em Piatã.\n\nDesde então, a Chácara União vem conquistando posições de destaque em concursos e avaliações de qualidade, resultado da dedicação e do cuidado em todas as etapas da produção, do manejo da lavoura à colheita, do processamento à secagem.\n\nCom a contribuição técnica de seu filho, Glayco Barbosa, engenheiro agrônomo, a propriedade une a experiência das gerações ao conhecimento científico, à inovação e ao aperfeiçoamento contínuo das práticas agrícolas e de pós-colheita.\n\nMais do que produzir cafés especiais, a Chácara União preserva um legado familiar e contribui para fortalecer a identidade dos cafés da Chapada Diamantina. Sua história representa a união entre tradição, conhecimento e paixão, transformando o trabalho de gerações em qualidade e reconhecimento.\n\nChácara União: uma história de raízes profundas, dedicação e excelência, que atravessa gerações e leva a essência de Piatã ao mundo.", "histEn": "The history of Chácara União is marked by family tradition, love for the land and the constant pursuit of excellence in specialty coffee production. Located in Piatã, in the Chapada Diamantina, the property carries a legacy of generations dedicated to quality coffee growing.\n\nWith more than 80 years of family tradition, João Florentino Barbosa devoted more than 35 years to commercial coffee production. In 2003, he began a new stage of his journey, focusing his efforts on specialty coffees and investing in improving production processes and valuing quality.\n\nRecognition came in 2010, when Chácara União took 10th place in the Cup of Excellence, one of the most prestigious specialty coffee competitions in the world. This achievement marked the property's history and highlighted the potential of the coffees produced in Piatã.\n\nSince then, Chácara União has achieved prominent positions in competitions and quality evaluations, the result of dedication and care at every stage of production, from crop management t
