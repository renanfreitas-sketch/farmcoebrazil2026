o harvest, and from processing to drying.\n\nWith the technical contribution of his son, agronomist Glayco Barbosa, the property combines the experience of generations with scientific knowledge, innovation and the continuous improvement of farming and post-harvest practices.\n\nMore than producing specialty coffees, Chácara União preserves a family legacy and helps strengthen the identity of Chapada Diamantina coffees. Its story represents the union of tradition, knowledge and passion, turning the work of generations into quality and recognition.\n\nChácara União: a story of deep roots, dedication and excellence that spans generations and takes the essence of Piatã to the world.", "site": "", "dir": "img/f20/", "imgs": [["01.jpg", 727, 1079], ["02.jpg", 960, 1280], ["03.jpg", 1280, 960], ["04.jpg", 1400, 1050], ["05.jpg", 1079, 1400], ["06.jpg", 1001, 585]], "cover": "04.jpg"}, {"id": "fazenda-fortaleza-dry", "cat": "dry", "farm": "Fazenda Fortaleza", "producer": "Luciano Augusto Ferreira", "region": "Mantiqueira de Minas", "city": "São Gonçalo do Sapucaí", "uf": "MG", "variety": "Catuaí Amarelo", "procPt": "Natural", "procEn": "Natural", "alt": "1.100", "histPt": "A Fazenda Fortaleza dos Borges, localizada na região da Ressaca, em São Gonçalo do Sapucaí, no Sul de Minas Gerais, tem sua história ligada à tradição familiar da cafeicultura. A propriedade ganhou destaque pela produção de cafés especiais, conquistando o 3º lugar no concurso Coffee of the Year, em 2017. Em 2018, lançou o café Amaranta, reforçando seu compromisso com a qualidade e a valorização da cultura cafeeira mineira. A fazenda representa a união entre tradição, dedicação à terra e excelência na produção de café.", "histEn": "Fazenda Fortaleza dos Borges, located in the Ressaca area of São Gonçalo do Sapucaí, in the south of Minas Gerais, has a history tied to the family's coffee-growing tradition. The property stood out for its specialty coffee production, taking 3rd place in the Coffee of the Year competition in 2017. In 2018, it launched Amaranta coffee, reinforcing its commitment to quality and to the coffee culture of Minas Gerais. The farm represents the union of tradition, dedication to the land and excellence in coffee production.", "site": "", "dir": "img/f21/", "imgs": [["01.jpg", 778, 1280], ["02.jpg", 746, 1016], ["03.jpg", 641, 1162], ["04.jpg", 998, 1400]], "cover": "01.jpg"}, {"id": "sitio-tres-barras-dry", "cat": "dry", "farm": "Sítio Três Barras", "producer": "Manassés Sampaio Dias", "region": "Região Vulcânica", "city": "Divinolândia", "uf": "SP", "variety": "Bourbon Amarelo", "procPt": "Via Seca: Natural", "procEn": "Natural (Dry Process)", "alt": "1.270", "histPt": "O Sítio Três Barras pertencia originalmente ao avô de Manassés, o Sr. José Caetano Dias, na década de 1940. Na época, a atividade predominante era o cultivo de batata. Nos anos 1950, José Caetano, que gostava de cafeicultura, plantou cerca de 5.000 pés de café, mas, como não obteve boa produtividade, a lavoura foi abandonada. Somente em 2001 o pai de Manassés, Artesio Sampaio Dias, decidiu tentar novamente. O potencial para a produção de cafés especiais foi percebido e desenvolvido em 2015. Nesse mesmo ano, Manassés participou de concursos regionais e obteve bons resultados. A parceria com a SMC abriu portas para o mercado internacional de cafés de alta qualidade.\n\nO manejo agronômico cuidadoso, até o processamento e o pós-colheita, faz com que a grande maioria dos lotes produzidos seja de qualidade superior. A colheita começa no ponto ideal de maturação, e os frutos são transportados diariamente, separados por talhão, variedade e período de colheita. O principal processo é o natural seco ao sol, com uso de terreiros suspensos para garantir uma secagem mais lenta e uniforme.", "histEn": "Sítio Três Barras originally belonged to Manassés' grandfather, Mr. José Caetano Dias, in the 1940s. At the time, the predominant activity was potato growing. In the 1950s, José Caetano, who was keen on coffee growing, planted around 5,000 coffee trees, but because he didn't get good yields, the crop was discontinued. It wasn't until 2001 that Manassés' father, Artesio Sampaio Dias, decided to give it another go. The potential for producing specialty coffees was noticed and developed in 2015. In that same year, Manassés took part in regional competitions and achieved positive results. The partnership with SMC has opened doors to the international market for high-quality coffees.\n\nCareful agronomic management, through to processing and post-harvest, means that the vast majority of the lots produced are of higher quality. Harvesting begins at the ideal stage of ripeness and the coffee cherries are transported daily, being separated by plot, variety and time of harvest. The main processing is natural sun-dried, with the use of raised beds to guarantee a slower and more even drying.", "site": "", "dir": "img/f10/", "imgs": [["01.jpg", 933, 1400], ["02.jpg", 933, 1400], ["03.jpg", 933, 1400], ["04.jpg", 1400, 933], ["05.jpg", 1400, 933], ["06.jpg", 1400, 933]], "cover": "04.jpg"}, {"id": "fazenda-matao-dry", "cat": "dry", "farm": "Fazenda Matão", "producer": "Márcio Junqueira de Souza e Silva", "region": "Região Vulcânica", "city": "Poços de Caldas", "uf": "MG", "variety": "Arara", "procPt": "Via Seca: Natural", "procEn": "Natural (Dry Process)", "alt": "1.100", "histPt": "A Fazenda Matão foi criada em 1945 por Adhemar de Souza e Silva e Sylvia Junqueira de Souza e Silva, sua esposa, que já era de família tradicional na cafeicultura. Ele iniciou o plantio e cultivo de café e por volta de 1950 já tinha suas primeiras colheitas. Em 1987 a administração da fazenda passou para o filho do casal, Marcio Junqueira de Souza e Silva e em 1994 para o neto, Affonso Junqueira de Souza e Silva, 3ª geração da família no comando da fazenda.\n\nParalelo a isso, desde 1971 a gerência da fazenda é de responsabilidade de Paulo Marrafon, que acompanhou o avô, pai e filho na trajetória da fazenda e hoje também já tem os filhos e netos trabalhando na mesma lavoura.\n\nAté o ano de 2020 a fazenda não participava ativamente dos concursos de cafés especiais, mas em 2021 foi a 1ª colocada no Concurso de Cafés Especiais de Poços de Caldas e Região, com a variedade Arara, e isso mudou a maneira de lidar com os cafés especiais da fazenda.\n\nDesde então todo ano a Fazenda dedica boa parte de sua produção a cafés especiais, participando de diversos concursos de qualidade e obtendo ótimos resultados.", "histEn": "Fazenda Matão was founded in 1945 by Adhemar de Souza e Silva and his wife, Sylvia Junqueira de Souza e Silva, who already came from a traditional coffee-growing family. He began planting and growing coffee, and by around 1950 he had his first harvests. In 1987, management of the farm passed to the couple's son, Márcio Junqueira de Souza e Silva, and in 1994 to their grandson, Affonso Junqueira de Souza e Silva, the third generation of the family to run the farm.\n\nMeanwhile, since 1971 the farm has been managed by Paulo Marrafon, who has accompanied grandfather, father and son along the farm's journey and today also has his own children and grandchildren working on the same crops.\n\nUntil 2020 the farm did not actively take part in specialty coffee competitions, but in 2021 it won 1st place in the Specialty Coffee Competition of Poços de Caldas and Region with the Arara variety, which changed the way the farm approached specialty coffee. Since then, every year the farm has dedicated a good part of its production to specialty coffees, taking part in several quality competitions and achieving excellent results.", "site": "", "dir": "img/f22/", "imgs": [["01.jpg", 1050, 1400], ["02.jpg", 1050, 1400], ["03.jpg", 1400, 945], ["04.jpg", 1048, 1400], ["05.jpg", 1400, 1050]], "cover": "03.jpg"}, {"id": "fazenda-das-almas-dry", "cat": "dry", "farm": "Fazenda das Almas", "producer": "Matheus Maringoli Muniz", "region": "Sudoeste de Minas", "city": "Cabo Verde", "uf": "MG", "variety": "Geisha", "procPt": "Natural", "procEn": "Natural", "alt": "1.050", "histPt": "Fundada em 1942 pela Família Muniz, a Fazenda das Almas nasceu do amor pelo café nas montanhas de Cabo Verde, sul de Minas Gerais. Nos primeiros anos, sem energia elétrica, o beneficiamento era feito com máquinas a vapor — símbolo da dedicação e resiliência das primeiras gerações. O nome “Almas” vem da primeira colonização portuguesa na região, quando imigrantes dos Açores realizavam cultos religiosos nos pontos mais altos, acreditando estar mais próximos das almas.\n\nCom mais de oito décadas de história, a Fazenda das Almas tornou-se referência em qualidade, tradição e inovação. Hoje, sob gestão da terceira geração, celebra 84 colheitas da Família Muniz. O compromisso com a excelência impulsionou avanços contínuos: uso de adubos minerais, corretivos, defensivos mais seguros, mecanização gradual, energia própria e fermentação, elevando produtividade e qualidade sem perder o vínculo com o trabalho manual.\n\nA fazenda cultiva 102 hectares de café arábica das variedades Mundo Novo, Catuaí, Rubi, Icatu, Bourbon, Arara, Paraíso, Acauã e Geisha, entre 950 e 1.150 metros de altitude. O microclima montanhoso favorece a formação de grãos especiais, e a topografia íngreme mantém viva a colheita manual, fortalecendo o aspecto social e a geração de empregos locais. Desde 1992, o café é descascado e processado com extremo cuidado, com frutos separados por estágio de maturação e preparados individualmente para garantir excelência no resultado final.\n\nPioneira em certificações e manejo sustentável, a Fazenda das Almas foi uma das primeiras da região a conquistar UTZ e BSCA (2004) e Rainforest Alliance (2009). A busca constante por qualidade levou ao uso de fermentação controlada com alta repetibilidade, aprimorando o perfil sensorial e assegurando consistência safra após safra. Assim, tradição, sustentabilidade e tecnologia se unem para manter viva a essência da Família Muniz: produzir cafés que refletem sua história, seu terroir e a paixão de gerações pela excelência.", "histEn": "Founded in 1942 by the Muniz family, Fazenda das Almas was born from a love of coffee in the mountains of Cabo Verde, in southern Minas Gerais. In the early years, without electricity, processing was done with steam-powered machines, a symbol of the dedication and resilience of the first generations. The name \"Almas\" (Souls) comes from the first Portuguese settlement in the region, when immigrants from the Azores held religious services on the highest points, believing they were closer to the souls.\n\nWith more than eight decades of history, Fazenda das Almas has become a benchmark for quality, tradition and innovation. Today, under the management of the third generation, it celebrates 84 harvests by the Muniz family. The commitment to excellence drove continuous progress: the use of mineral fertilizers, soil correctives, safer crop protection, gradual mechanization, its own energy and fermentation, raising productivity and quality without losing the bond with manual work.\n\nThe farm grows 102 hectares of arabica coffee of the Mundo Novo, Catuaí, Rubi, Icatu, Bourbon, Arara, Paraíso, Acauã and Geisha varieties, between 950 and 1,150 meters above sea level. The mountain microclimate favors the formation of special beans, and the steep topography keeps hand-picking alive, strengthening the social aspect and local job creation. Since 1992, the coffee has been pulped and processed with extreme care, with cherries separated by ripeness and prepared individually to ensure excellence in the final result.\n\nA pioneer in certifications and sustainable management, Fazenda das Almas was one of the first in the region to earn UTZ and BSCA (2004) and Rainforest Alliance (2009) certifications. The constant pursuit of quality led to the use of controlled fermentation with high repeatability, enhancing the sensory profile and ensuring consistency harvest after harvest. In this way, tradition, sustainability and technology come together to keep alive the essence of the Muniz family: producing coffees that reflect their history, their terroir and generations' passion for excellence.", "site": "", "dir": "img/f23/", "imgs": [["01.jpg", 1050, 1400], ["02.jpg", 1050, 1400], ["03.jpg", 1280, 853], ["04.jpg", 1400, 1050], ["05.jpg", 1050, 1400]], "cover": "03.jpg"}, {"id": "vale-dos-tres-morros-dry", "cat": "dry", "farm": "Vale dos Três Morros", "producer": "Paulo Marcelo Zimmermann Filho", "region": "Chapada Diamantina", "city": "Piatã", "uf": "BA", "variety": "Arara", "procPt": "Natural", "procEn": "Natural", "alt": "1.430", "histPt": "A 1.430 metros de altitude, entre as montanhas da Chapada Diamantina, nasce a história da Fazenda Família Três Morros, um projeto familiar dedicado à produção de cafés especiais de origem.\n\nLocalizada na região dos Três Morros, em Piatã, a fazenda está inserida em um território singular, marcado por montanhas, afloramentos rochosos, nascentes e uma natureza preservada. O clima de altitude, as temperaturas amenas e a maturação lenta dos frutos contribuem para a formação de cafés de grande complexidade sensorial.\n\nNossa produção é conduzida com atenção a cada etapa, do cuidado com a terra à colheita e ao processamento dos grãos. Mais do que produzir cafés de excelência, buscamos expressar em cada safra a identidade do lugar onde vivemos e cultivamos.\n\nEm 2024, estivemos entre os 50 melhores cafés do Brasil no Cup of the Year. Agora, em 2026, retornamos ao cenário dos grandes concursos com nosso Arara de processo natural, levando conosco o resultado de anos de dedicação, aprendizado e trabalho.", "histEn": "At 1,430 meters above sea level, among the mountains of the Chapada Diamantina, the story of Fazenda Família Três Morros begins: a family project dedicated to producing specialty origin coffees.\n\nLocated in the Três Morros area of Piatã, the farm is set in a unique territory marked by mountains, rock outcrops, springs and preserved nature. The high-altitude climate, mild temperatures and slow ripening of the cherries contribute to coffees of great sensory complexity.\n\nOur production is carried out with attention to every stage, from caring for the land to harvesting and processing the beans. More than producing excellent coffees, we seek to express in each harvest the identity of the place where we live and grow.\n\nIn 2024, we were among the 50 best coffees in Brazil in the Coffee of the Year competition. Now, in 2026, we return to the major competitions with our natural-process Arara, bringing with us the result of years of dedication, learning and hard work.", "site": "", "dir": "img/f24/", "imgs": [["01.jpg", 787, 1400], ["02.jpg", 1400, 1050], ["03.jpg", 1050, 1400], ["04.jpg", 1050, 1400], ["05.jpg", 1400, 1050], ["06.jpg", 1400, 1050]], "cover": "02.jpg"}, {"id": "sitio-orube-dry", "cat": "dry", "farm": "Sítio Orube", "producer": "Philippe Jacques Louis Maillard", "region": "Mantiqueira de Minas", "city": "Brazópolis", "uf": "MG", "variety": "Catuaí Amarelo", "procPt": "Via Seca: Natural", "procEn": "Natural (Dry Process)", "alt": "1.300", "histPt": "Um café especial, orgânico, nascido de uma história fora do comum.\n\nFundado por um belga que vive no Brasil há quase 30 anos, o sítio ORUBE produz um café especial, rico e saboroso, respeitando a natureza e os mais altos padrões de qualidade.\n\nExpatriado há quase 30 anos no Brasil, o apelo por uma vida mais saudável, mais simples, mais próxima da natureza, quem sabe uma volta às raízes, levou-me a uma busca por uma propriedade rural.\n\nFoi uma verdadeira corrida de obstáculos, porque o lugar que eu procurava tinha que atender a uma série de critérios precisos. Mudei-me no finalzinho de 2017. Alguns anos de aprendizado, descobertas, estudos e certificações foram necessários para decidir que caminho tomar. Em 2020, a decisão foi tomada: a produção de café poderia começar. E em 2021, rebatizei o lugar: estavam nascendo o sítio e o café Orube!\n\nComo produtor rural, orgânico, certificado por diversas entidades, é com orgulho e grande prazer que lhe trazemos o que você exige: a excelência do que é único!", "histEn": "A specialty, organic coffee born from an unusual story. Founded by a Belgian who has lived in Brazil for almost 30 years, Sítio Orube produces a rich and flavorful specialty coffee, respecting nature and the highest quality standards.\n\nAfter almost 30 years as an expatriate in Brazil, the call for a healthier, simpler life closer to nature, perhaps a return to my roots, led me to search for a rural property. It was a real obstacle course, because the place I was looking for had to meet a series of precise criteria. I moved at the very end of 2017. A few years of learning, discovery, study and certifications were needed to decide which path to take. In 2020, the decision was made: coffee production could begin. And in 2021, I renamed the place: Sítio Orube and Orube coffee were born!\n\nAs an organic rural producer certified by several bodies, it is with pride and great pleasure that we bring you what you demand: the excellence of what is unique!", "site": "https://orube-coffee.com", "dir": "img/f25/", "imgs": [["01.jpg", 1400, 787], ["02.jpg", 1152, 769], ["03.jpg", 1400, 934], ["04.jpg", 1400, 1050], ["05.jpg", 736, 551], ["06.jpg", 839, 629]], "cover": "01.jpg"}, {"id": "fazenda-baoba-wet", "cat": "wet", "farm": "Fazenda Baobá", "producer": "Arnaldo Alves Vieira", "region": "Região Vulcânica", "city": "São Sebastião da Grama", "uf": "SP", "variety": "Catucaí Vermelho", "procPt": "Honey", "procEn": "Honey", "alt": "1.350", "histPt": "A Fazenda Baobá nasceu em 2005, em São Sebastião da Grama-SP, uma excelente região cafeeira devido ao solo rico e características climáticas favoráveis ao plantio do café arábica. Com lavouras em até 1400m de altitude, a fazenda dedica-se de corpo e alma à busca pela qualidade e inovação, mas sem esquecer do cuidado com tudo e com todos. O respeito ao entorno vai do plantio e proteção ambiental até a colheita e o acolhimento.\n\nE tudo isso não nasceu por acaso. A paixão pelo café acompanha a família proprietária há muito tempo. Atuantes no setor financeiro, decidiram criar a Fazenda Baobá em 2005 já voltada para produção de cafés de alta qualidade com sustentabilidade. E, desde então, vem construindo sua história.", "histEn": "Fazenda Baobá was born in 2005 in São Sebastião da Grama, São Paulo, an excellent coffee region thanks to its rich soil and climate conditions favorable to arabica coffee. With crops at up to 1,400 meters above sea level, the farm dedicates itself body and soul to the pursuit of quality and innovation, without forgetting to care for everything and everyone. Respect for its surroundings extends from planting and environmental protection to harvest and hospitality.\n\nNone of this happened by chance. A passion for coffee has accompanied the owning family for a long time. Working in the financial sector, they decided to create Fazenda Baobá in 2005, already focused on producing high-quality coffees sustainably. Since then, it has been building its story.", "site": "", "dir": "img/f26/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 788], ["03.jpg", 1400, 788], ["04.jpg", 1400, 951], ["05.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "sitio-vargem-alegre-wet", "cat": "wet", "farm": "Sítio Vargem Alegre", "producer": "Cleverson Daniel da Silva", "region": "Mantiqueira de Minas", "city": "Cristina", "uf": "MG", "variety": "Geisha", "procPt": "Honey/Lavado", "procEn": "Honey/Washed", "alt": "1.250", "histPt": "A Fazenda Vargem Alegre, localizada em Cristina, no coração da Serra da Mantiqueira, em Minas Gerais, nasceu em 2014, pelas mãos de Cleverson Daniel da Silva, com o propósito de dar identidade e valor aos cafés especiais produzidos pela família, que carrega gerações de tradição na cafeicultura.\n\nEm uma região de altitude elevada, onde o clima ameno favorece a maturação lenta dos frutos, a fazenda encontrou sua vocação na produção de cafés de qualidade excepcional. Ao longo dessa trajetória, enfrentou desafios, superou dificuldades e conquistou reconhecimento, incluindo uma premiação na Cup of Excellence em 2016, marco importante para a história da propriedade e para a valorização dos cafés de Cristina-MG.\n\nHoje, a Vargem Alegre une tradição familiar, agricultura sustentável e inovação nos processos de pós-colheita, buscando revelar a identidade e o potencial sensorial de cada lote.", "histEn": "Fazenda Vargem Alegre, located in Cristina, in the heart of the Serra da Mantiqueira in Minas Gerais, was founded in 2014 by Cleverson Daniel da Silva, with the purpose of giving identity and value to the specialty coffees produced by his family, which carries generations of coffee-growing tradition.\n\nIn a high-altitude region, where the mild climate favors the slow ripening of the cherries, the farm found its calling in producing coffees of exceptional quality. Along the way, it faced challenges, overcame difficulties and earned recognition, including an award in the Cup of Excellence in 2016, an important milestone for the property's history and for the recognition of the coffees of Cristina, Minas Gerais.\n\nToday, Vargem Alegre combines family tradition, sustainable agriculture and innovation in post-harvest processing, seeking to reveal the identity and sensory potential of each lot.", "site": "", "dir": "img/f27/", "imgs": [["01.jpg", 1280, 854], ["02.jpg", 1280, 854], ["03.jpg", 1280, 960], ["04.jpg", 1050, 1400], ["05.jpg", 1400, 934], ["06.jpg", 1400, 934]], "cover": "01.jpg"}, {"id": "sitio-taruma-wet", "cat": "wet", "farm": "Sítio Tarumã", "producer": "Eduardo Daniel da Silva", "region": "Mantiqueira de Minas", "city": "Cristina", "uf": "MG", "variety": "Catuaí Amarelo, Geisha", "procPt": "Via Úmida: Descascado Honey", "procEn": "Wet Process: Pulped Natural Honey", "alt": "1.250", "histPt": "Localizado em Cristina, no sul de Minas Gerais, o Sítio Tarumã carrega a história de uma família ligada à cafeicultura há gerações. À frente da propriedade está Eduardo Daniel da Silva, representante da terceira geração de produtores de café, que mantém viva a tradição familiar enquanto busca novas formas de valorizar a produção e o meio ambiente.\n\nSua relação com o café é construída a partir do conhecimento transmitido entre gerações, do trabalho diário no campo e do respeito à natureza. No Sítio Tarumã, a produção vai além do cultivo: envolve o compromisso com práticas sustentáveis, o cuidado com o solo e a busca pelo equilíbrio entre produtividade e preservação ambiental.\n\nA propriedade também se dedica aos processos de pós-colheita por via úmida, uma etapa que exige atenção e controle para preservar a qualidade dos grãos e expressar o potencial sensorial dos cafés. Cada escolha, desde os cuidados com a lavoura até o processamento, contribui para construir a identidade de cada lote.\n\nEm uma região reconhecida pela tradição cafeeira e pelas condições favoráveis à produção de cafés especiais, Eduardo busca honrar o legado das gerações anteriores, incorporando uma visão consciente e responsável para o futuro.\n\nO Sítio Tarumã representa, assim, a união entre tradição, sustentabilidade e dedicação à cafeicultura. Uma história de continuidade e evolução, na qual cada safra carrega não apenas o resultado de um trabalho cuidadoso, mas também o compromisso de produzir respeitando a terra que torna tudo isso possível.", "histEn": "Located in Cristina, in southern Minas Gerais, Sítio Tarumã carries the story of a family tied to coffee growing for generations. Leading the property is Eduardo Daniel da Silva, representing the third generation of coffee growers, who keeps the family tradition alive while seeking new ways to add value to production and the environment.\n\nHis relationship with coffee is built on knowledge passed down through generations, daily work in the field and respect for nature. At Sítio Tarumã, production goes beyond cultivation: it involves a commitment to sustainable practices, care for the soil and the search for balance between productivity and environmental preservation.\n\nThe property is also dedicated to wet-process post-harvest, a stage that requires attention and control to preserve bean quality and express the sensory potential of the coffees. Every choice, from crop care to processing, helps build the identity of each lot.\n\nIn a region known for its coffee tradition and favorable conditions for specialty coffee production, Eduardo seeks to honor the legacy of previous generations while adopting a conscious and responsible vision for the future.\n\nSítio Tarumã thus represents the union of tradition, sustainability and dedication to coffee growing. A story of continuity and evolution, in which each harvest carries not only the result of careful work, but also the commitment to produce while respecting the land that makes it all possible.", "site": "", "dir": "img/f28/", "imgs": [["01.jpg", 1050, 1400], ["02.jpg", 1400, 933], ["03.jpg", 1279, 1280], ["04.jpg", 1050, 1400], ["05.jpg", 1050, 1400], ["06.jpg", 1050, 1400]], "cover": "02.jpg"}, {"id": "fazenda-boa-vista-wet", "cat": "wet", "farm": "Fazenda Boa Vista", "producer": "Flávio Roberto Carvalho Ferraz", "region": "Mantiqueira de Minas", "city": "Dom Viçoso", "uf": "MG", "variety": "Catucaí", "procPt": "Cereja Descascado", "procEn": "Pulped Natural", "alt": "1.280", "histPt": "A Fazenda Boa Vista está localizada em Dom Viçoso, MG, na estrada que liga o município a Maria da Fé. Sua história teve início por volta de 1880, quando Custódio Teodoro Ribeiro de Carvalho fundou a Fazenda do Rosário, onde se dedicava à criação de gado leiteiro e iniciou o cultivo de café.\n\nApós seu falecimento, em 1952, sua filha Maria Aparecida Carvalho Ferraz e seu marido, Dr. Pedro Carlos Junqueira Ferraz, herdaram a parte mais alta da propriedade, que passou a se chamar Fazenda Boa Vista devido à sua privilegiada vista panorâmica, que alcança São Lourenço e as montanhas de Caxambu, Baependi, Cruzília e Aiuruoca.\n\nO cultivo de café na nova propriedade começou em 1975, inicialmente com as variedades Catuaí e Mundo Novo. Em 1986, a fazenda foi dividida entre os filhos do casal. Atualmente, a produção de café está sob responsabilidade dos irmãos Lívio César, Marcelo e Flávio Carvalho Ferraz, que buscam constantemente aprimorar o cultivo das variedades Bourbon, Catucaí, Catuaí e Icatu.\n\nCom altitudes médias de 1.200 metros, solos favoráveis e o clima característico da Serra da Mantiqueira, a Fazenda Boa Vista reúne condições que contribuem para a produção de cafés de excelência. A adoção de técnicas modernas e sustentáveis, a melhoria das instalações e equipamentos e a qualificação da mão de obra também têm contribuído para a evolução da qualidade dos grãos.\n\nEm 2011, foi inaugurada a nova sede da fazenda, projetada pelo arquiteto Marcelo Carvalho Ferraz, da Brasil Arquitetura. A Casa Dom Viçoso recebeu o prêmio Best of Architecture 2012, na categoria Casa de Campo.\n\nA preservação ambiental é outro compromisso da propriedade, que protege nascentes e amplia a vegetação de Mata Atlântica às margens do rio. Também está sendo implantada uma reserva com mais de 200 espécies de plantas nativas, muitas delas raras ou ameaçadas de extinção, devidamente catalogadas para futuras pesquisas científicas e usos culinários.", "histEn": "Fazenda Boa Vista is located in Dom Viçoso, Minas Gerais, on the road linking the town to Maria da Fé. Its history began around 1880, when Custódio Teodoro Ribeiro de Carvalho founded Fazenda do Rosário, where he raised dairy cattle and began growing coffee.\n\nAfter his death in 1952, his daughter Maria Aparecida Carvalho Ferraz and her husband, Dr. Pedro Carlos Junqueira Ferraz, inherited the highest part of the property, which came to be called Fazenda Boa Vista (Good View) for its privileged panoramic view reaching São Lourenço and the mountains of Caxambu, Baependi, Cruzília and Aiuruoca.\n\nCoffee growing on the new property began in 1975, initially with the Catuaí and Mundo Novo varieties. In 1986, the farm was divided among the couple's children. Today, coffee production is run by brothers Lívio César, Marcelo and Flávio Carvalho Ferraz, who constantly seek to improve the cultivation of the Bourbon, Catucaí, Catuaí and Icatu varieties.\n\nWith average altitudes of 1,200 meters, favorable soils and the characteristic climate of the Serra da Mantiqueira, Fazenda Boa Vista brings together conditions that contribute to excellent coffees. The adoption of modern and sustainable techniques, improved facilities and equipment, and a more qualified workforce have also contributed to the evolution of bean quality.\n\nIn 2011, the farm's new headquarters was inaugurated, designed by architect Marcelo Carvalho Ferraz of Brasil Arquitetura. Casa Dom Viçoso received the Best of Architecture 2012 award in the Country House category.\n\nEnvironmental preservation is another commitment of the property, which protects springs and expands the Atlantic Forest vegetation along the riverbanks. A reserve with more than 200 species of native plants, many of them rare or endangered, is also being established, duly catalogued for future scientific research and culinary uses.", "site": "", "dir": "img/f29/", "imgs": [["01.jpg", 960, 1280], ["02.jpg", 1400, 788], ["03.jpg", 1000, 667], ["04.jpg", 1400, 788], ["05.jpg", 720, 1280]], "cover": "02.jpg"}, {"id": "fazenda-borela-espeschit-wet", "cat": "wet", "farm": "Fazenda Borela Espeschit", "producer": "Guilherme Tadeu de Melo Espeschit", "region": "Matas de Minas", "city": "Manhuaçu", "uf": "MG", "variety": "Arara", "procPt": "Honey", "procEn": "Honey", "alt": "900", "histPt": "Quando você sonha sozinho, isso é apenas um sonho, mas se for herdado por gerações, é um projeto. José Pedro Espeschit, Eng Agrimensor, adquiriu uma fazenda em 1948 próxima à rodovia BR 262 em Manhuaçu MG. Ele preservou as nascentes e a floresta além das obrigações legislativas e e formou a primeira lavoura de Catuaí, cujos remanescentes ainda existem na fazenda nas matas, onde foram dispersas pela avifauna local. Seu filho, o Eng. Sanitarista Jorge Nogueira Espeschit, teve contribuições únicas para o saneamento e o meio ambiente brasileiros. Ele assumiu a responsabilidade pela propriedade nos anos 70 e plantou mais café, desta vez Mundo Novo, além de criar gado leiteiro. Seu maior apoio veio de sua esposa, Graciema Borela Espeschit, uma \"Nonna\" famosa por seus queijos caseiros, café e mesa farta para visitantes e família. Donna Graciema deu à luz 5 filhos: Maurício, Cláudio, Luiza, Elizabeth e José Guilherme. Elizabeth faleceu em circunstâncias inesperadas e, depois de um tempo, seus pais também, criando desafios na sucessão da fazenda. Em 2021, Guilherme T. M. Espeschit, engenheiro ambiental e mestre em Saneamento, Recursos Ambientalistas e Hídricos, bisneto de José Pedro e filho de José Guilherme, apresentou um projeto para a continuidade da tradição do café e proteção ambiental, desta vez, com um desafio maior, iniciar uma produção 100% orgânica desde o início. Com a confiança e união familiar, esse sonho de longa data se concretizou e é aqui que reside o Caffè di Borella, batizado em homenagem a Donna Graciema Borela. Da primeira safra realizada, fomos finalistas em concursos da Emater e Senar, assim como as sucessivas. As amostras encaminhadas para o COE correspondem a nossa terceira safra dessa nova fase, fruto de intenso trabalho e dedicação.", "histEn": "When you dream alone, it is only a dream, but if it is inherited by generations, it is a project. José Pedro Espeschit, a surveying engineer, acquired a farm in 1948 near the BR-262 highway in Manhuaçu, Minas Gerais. He preserved the springs and the forest beyond legal requirements and established the first Catuaí crop, whose remnants still exist in the farm's woods, where they were dispersed by local birds. His son, sanitary engineer Jorge Nogueira Espeschit, made unique contributions to Brazilian sanitation and the environment. He took over the property in the 1970s and planted more coffee, this time Mundo Novo, as well as raising dairy cattle. His greatest support came from his wife, Graciema Borela Espeschit, a \"Nonna\" famous for her homemade cheeses, coffee and generous table for visitors and family. Donna Graciema had five children: Maurício, Cláudio, Luiza, Elizabeth and José Guilherme. Elizabeth passed away unexpectedly and, some time later, so did her parents, creating challenges in the farm's succession. In 2021, Guilherme T. M. Espeschit, an environmental engineer with a master's degree in Sanitation, Environment and Water Resources, great-grandson of José Pedro and son of José Guilherme, presented a project to continue the coffee tradition and environmental protection, this time with a bigger challenge: starting 100% organic production from the outset. With the family's trust and unity, this long-held dream came true, and this is where Caffè di Borella lives, named in honor of Donna Graciema Borela. From our first harvest, we were finalists in Emater and Senar competitions, as with the following ones. The samples sent to the COE correspond to our third harvest in this new phase, the fruit of intense work and dedication.", "site": "", "dir": "img/f30/", "imgs": [["01.jpg", 787, 1400], ["02.jpg", 1050, 1400], ["03.jpg", 1400, 788], ["04.jpg", 788, 1400], ["05.jpg", 788, 1400], ["06.jpg", 1400, 788]], "cover": "03.jpg"}, {"id": "serra-das-tres-barras-wet", "cat": "wet", "farm": "Serra das Três Barras", "producer": "José Wagner Ribeiro Junqueira", "region": "Mantiqueira de Minas", "city": "Carmo de Minas", "uf": "MG", "variety": "Arara", "procPt": "Cereja Descascado", "procEn": "Pulped Natural", "alt": "1.150", "histPt": "A Serra das Três Barras surgiu a partir da divisão da bicentenária Fazenda das Três Barras, tradicionalmente dedicada à produção de cafés de excepcional qualidade. Atualmente, a propriedade pertence a José Wagner Ribeiro Junqueira e integra um grupo familiar formado também por sua esposa, Margarida Maria de Castro Junqueira, e seus três filhos, Kleber, Ralph e Herbert de Castro Junqueira.\n\nAo todo, a família cultiva 160 hectares de café distribuídos em seis propriedades, com uma produção aproximada de 3.500 sacas beneficiadas por ano. A Fazenda Serra das Três Barras é a sede do grupo, onde todos os cafés são processados e preparados para comercialização.\n\nAs lavouras estão localizadas entre 1.100 e 1.450 metros de altitude, em meio à paisagem característica da Serra da Mantiqueira. Solos férteis, temperaturas amenas durante todo o ano, estações bem definidas e precipitações anuais entre 1.700 e 2.200 mm proporcionam condições ideais para a produção de cafés especiais de alta qualidade.\n\nApós oito gerações dedicadas quase exclusivamente às atividades rurais, a família mantém um forte compromisso com a preservação ambiental. As matas nativas e as diversas nascentes presentes nas propriedades são cuidadosamente protegidas, garantindo que a produção cafeeira permaneça em harmonia com a natureza.\n\nA colheita é realizada manualmente, priorizando o ponto ideal de maturação dos frutos. Os cafés são colhidos sobre panos, evitando o contato com o solo, e transportados no mesmo dia para os terreiros de secagem. Quando necessário, a secagem é finalizada em secadores rotativos. Em seguida, os cafés permanecem em caixas especializadas por um período de 30 a 60 dias, antes de serem beneficiados e encaminhados à COCARIVE para análise e preparo conforme as exigências do mercado.\n\nA propriedade é certificada pelo programa Certifica Minas e acumula premiações em importantes concursos.", "histEn": "Serra das Três Barras was formed from the division of the bicentennial Fazenda das Três Barras, traditionally dedicated to producing coffees of exceptional quality. The property currently belongs to José Wagner Ribeiro Junqueira and is part of a family group that also includes his wife, Margarida Maria de Castro Junqueira, and their three sons, Kleber, Ralph and Herbert de Castro Junqueira.\n\nIn total, the family grows 160 hectares of coffee across six properties, with an output of approximately 3,500 processed bags per year. Fazenda Serra das Três Barras is the group's headquarters, where all the coffees are processed and prepared for sale.\n\nThe crops are located between 1,100 and 1,450 meters above sea level, amid the characteristic landscape of the Serra da Mantiqueira. Fertile soils, mild temperatures year-round, well-defined seasons and annual rainfall between 1,700 and 2,200 mm provide ideal conditions for producing high-quality specialty coffees.\n\nAfter eight generations dedicated almost exclusively to rural activities, the family maintains a strong commitment to environmental preservation. The native forests and numerous springs on the properties are carefully protected, ensuring that coffee production remains in harmony with nature.\n\nHarvesting is done by hand, prioritizing the ideal ripeness of the cherries. The coffees are picked onto cloths, avoiding contact with the ground, and taken the same day to the drying patios. When necessary, drying is finished in rotary dryers. The coffees then rest in specialized bins for 30 to 60 days before being hulled and sent to COCARIVE for analysis and preparation according to market requirements.\n\nThe property is certified by the Certifica Minas program and has won awards in important competitions.", "site": "", "dir": "img/f31/", "imgs": [["01.jpg", 788, 1400], ["02.jpg", 1400, 933], ["03.jpg", 1400, 933], ["04.jpg", 1400, 933], ["05.jpg", 1120, 1400]], "cover": "02.jpg"}, {"id": "sitio-araucaria-wet", "cat": "wet", "farm": "Sítio Araucária", "producer": "Kleber de Castro Junqueira", "region": "Mantiqueira de Minas", "city": "Carmo de Minas", "uf": "MG", "variety": "Arara", "procPt": "Cereja Descascado", "procEn": "Pulped Natural", "alt": "1.250", "histPt": "A história do Sítio Araucária tem origem na Sesmaria das Três Barras, concedida pela Coroa Portuguesa a Manoel Ramos da Silva no final do século XVIII. Em 1811, parte dessas terras foi adquirida por Custódio Ribeiro Pereira Guimarães, ancestral dos atuais proprietários. Ao longo das gerações, a gleba passou por subdivisões naturais até que, em 1993, ocorreu a transferência entre os sucessores de Custódio. Na ocasião, Kleber de Castro Junqueira adquiriu de Pedro Henrique Junqueira, primo de seu pai, as terras que hoje formam o Sítio Araucária.\n\nKleber integra um grupo familiar de produtores ao lado dos pais, José Wagner Ribeiro Junqueira e Margarida Maria de Castro Junqueira, e dos irmãos Ralph e Herbert de Castro Junqueira. O grupo cultiva café em seis propriedades, totalizando cerca de 160 hectares, com o processamento e a preparação da produção centralizados na Fazenda Serra das Três Barras, que beneficia, em média, 3.500 sacas por ano.\n\nLocalizadas na Serra da Mantiqueira, as lavouras estão em altitudes entre 1.100 e 1.450 metros, em uma região de clima ameno, estações bem definidas e precipitação anual entre 1.700 e 2.200 mm. A cafeicultura é a principal atividade da família há oito gerações, conduzida em harmonia com a natureza, com a preservação das áreas de mata nativa e das nascentes. A produção conta ainda com nove colaboradores permanentes e cerca de 30 trabalhadores durante a colheita.\n\nO café é colhido e transportado imediatamente para o processamento. Após o descascamento, os grãos seguem para os terreiros e, quando necessário, para secadores rotativos, permanecendo em tulhas por 60 a 90 dias. Beneficiado, o café é encaminhado aos armazéns da COCARIVE, onde os lotes são analisados e preparados conforme as demandas do mercado.\n\nA busca pela qualidade, aliada à produtividade, é fortalecida pela assistência técnica da COCARIVE, em parceria com a EMATER-MG.", "histEn": "The history of Sítio Araucária goes back to the Sesmaria das Três Barras, a land grant given by the Portuguese Crown to Manoel Ramos da Silva in the late 18th century. In 1811, part of these lands was acquired by Custódio Ribeiro Pereira Guimarães, an ancestor of the current owners. Over the generations, the land went through natural subdivisions until, in 1993, a transfer took place among Custódio's descendants. On that occasion, Kleber de Castro Junqueira acquired from Pedro Henrique Junqueira, his father's cousin, the land that now forms Sítio Araucária.\n\nKleber is part of a family group of growers alongside his parents, José Wagner Ribeiro Junqueira and Margarida Maria de Castro Junqueira, and his brothers Ralph and Herbert de Castro Junqueira. The group grows coffee on six properties totaling about 160 hectares, with processing and preparation centralized at Fazenda Serra das Três Barras, which processes an average of 3,500 bags per year.\n\nLocated in the Serra da Mantiqueira, the crops sit between 1,100 and 1,450 meters above sea level, in a region with a mild climate, well-defined seasons and annual rainfall between 1,700 and 2,200 mm. Coffee growing has been the family's main activity for eight generations, carried out in harmony with nature, with the preservation of native forest areas and springs. Production also relies on nine permanent employees and about 30 workers during the harvest.\n\nThe coffee is harvested and taken immediately for processing. After pulping, the beans go to the drying patios and, when necessary, to rotary dryers, then rest in storage bins for 60 to 90 days. Once hulled, the coffee is sent to COCARIVE's warehouses, where the lots are analyzed and prepared according to market demand.\n\nThe pursuit of quality, combined with productivity, is strengthened by COCARIVE's technical assistance in partnership with EMATER-MG.", "site": "", "dir": "img/f32/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 1400, 933], ["03.jpg", 1400, 933], ["04.jpg", 1400, 933], ["05.jpg", 1400, 933]], "cover": "01.jpg"}, {"id": "fazenda-passagem-de-pedra-wet", "cat": "wet", "farm": "Fazenda Passagem de Pedra", "producer": "Silviane Vanessa Leite Vieira de Melo", "region": "Chapada Diamantina", "city": "Piatã", "uf": "BA", "variety": "Arara", "procPt": "Via Úmida", "procEn": "Washed (Wet Process)", "alt": "1.250", "histPt": "Minha trajetória na cafeicultura nasceu da ligação familiar com o café e da inspiração do meu pai, Silvio Leite, uma referência mundial em cafés especiais. À frente da Fazenda Passagem de Pedra, busco honrar seu legado e construir minha própria história, unindo tradição, conhecimento e inovação.\n\nSituada em Piatã, na Chapada Diamantina, a propriedade reúne altitude e clima ameno, condições que favorecem a maturação lenta dos frutos e a expressão da identidade dessa origem. Nossa primeira colheita marcou o início de uma jornada guiada pela dedicação e pelo compromisso com a qualidade.\n\nNesse caminho, a variedade Arara ocupa um lugar especial. Seus frutos amarelos, o vigor das plantas e a maturação tardia se somam ao potencial para produzir uma bebida limpa e adocicada. Esses atributos reforçam nossa escolha por uma variedade capaz de aliar bom desempenho na lavoura à qualidade na xícara.\n\nPara desenvolver esse potencial, nosso trabalho começa no cuidado com a lavoura. Buscamos orientar o manejo pelas necessidades do solo e das plantas, com atenção à nutrição equilibrada, à disponibilidade de água e à saúde dos cafeeiros. O acompanhamento da maturação e o cuidado na colheita e no pós-colheita completam esse compromisso, valorizando o trabalho realizado ao longo de toda a safra.\n\nNosso propósito é aprimorar cada etapa da produção, incorporando ciência e aprendizado contínuo, com respeito à terra e às características de Piatã.\n\nMais do que produzir cafés especiais, quero preservar nossas raízes e acrescentar um novo capítulo à história da família. A cada safra, transformo a inspiração do meu pai em trabalho e dedicação, contribuindo para o reconhecimento dos cafés da nossa região.", "histEn": "My journey in coffee growing was born from my family's connection to coffee and the inspiration of my father, Sílvio Leite, a worldwide reference in specialty coffee. At the helm of Fazenda Passagem de Pedra, I seek to honor his legacy and build my own story, combining tradition, knowledge and innovation.\n\nLocated in Piatã, in the Chapada Diamantina, Bahia, the property combines altitude and a mild climate, conditions that favor the slow ripening of the cherries and the expression of this origin's identity. Our first harvest marked the start of a journey guided by dedication and a commitment to quality.\n\nAlong this path, the Arara variety holds a special place. Its yellow cherries, plant vigor and late ripening add up to the potential to produce a clean, sweet cup. These attributes reinforce our choice of a variety capable of combining good field performance with quality in the cup.\n\nTo develop this potential, our work begins with caring for the crop. We seek to guide management by the needs of the soil and the plants, with attention to balanced nutrition, water availability and the health of the coffee trees. Monitoring ripening and taking care during harvest and post-harvest complete this commitment, valuing the work carried out throughout the season.\n\nOur purpose is to improve every stage of production, incorporating science and continuous learning, with respect for the land and the characteristics of Piatã.\n\nMore than producing specialty coffees, I want to preserve our roots and add a new chapter to the family's story. With each harvest, I turn my father's inspiration into work and dedication, contributing to the recognition of our region's coffees.", "site": "", "dir": "img/f33/", "imgs": [["01.jpg", 960, 1280], ["02.jpg", 960, 1280], ["03.jpg", 960, 1280], ["04.jpg", 1050, 1400]], "cover": "01.jpg"}, {"id": "fazenda-cerca-de-pedras-sao-benedito-wet", "cat": "wet", "farm": "Fazenda Cerca de Pedras – São Benedito", "producer": "Sílvio Luís Leite", "region": "Chapada Diamantina", "city": "Piatã", "uf": "BA", "variety": "Catuaí", "procPt": "Via Úmida: Descascado", "procEn": "Wet Process: Pulped Natural", "alt": "1.250", "histPt": "A Fazenda Cerca de Pedras São Benedito representa a realização de um sonho. Em 2019, tornei-me produtor de primeira geração em Piatã, região que sempre admirei e cuja identidade cafeeira tive a alegria de ajudar a construir.\n\nMinha relação com essa origem começou em 1999, nas competições da BSCA e do Cup of Excellence. Tenho orgulho de ter participado da criação do concurso no Brasil e da elaboração de seus protocolos.\n\nA propriedade possui 32 hectares, dos quais 6 são cultivados com Catuaí Vermelho e Pacamara. Altitude, clima ameno, maturação lenta e estação seca favorecem a expressão de cafés doces, complexos e elegantes.\n\nNa São Benedito, a excelência começa na lavoura, com sombreamento, braquiária, irrigação por gotejamento e colheita seletiva. A seleção dos frutos maduros conta com a participação essencial das mulheres da equipe, seguida de secagem lenta em estufas e camas africanas.\n\nNa xícara, destacam-se doçura, textura sedosa, acidez equilibrada e final prolongado, com notas de mel, rapadura, frutas, flores e cítricos. Os naturais apresentam corpo e sabores de frutas maduras; os cerejas descascadas revelam clareza e delicadeza.\n\nEm 2020, nossa primeira colheita venceu o 17º Campeonato Nacional da ABIC e destacou-se no leilão. No ano seguinte, conquistei a 17ª colocação na estreia como produtor no Cup of Excellence Brasil.\n\nEm 2026, sob a condução de Kleumon Moreira e da equipe, seguimos aprimorando cada etapa. Certificada pela BSCA, a fazenda também tem o propósito de ser um espaço de ensino, experimentação e troca de conhecimentos, fortalecendo a comunidade e valorizando toda a cadeia.\n\nNossa história continua em cada florada e xícara, unindo paixão, pessoas, respeito à terra e compromisso permanente com a qualidade.", "histEn": "Fazenda Cerca de Pedras São Benedito represents a dream come true. In 2019, I became a first-generation grower in Piatã, Chapada Diamantina, Bahia, a region I have always admired and whose coffee identity I had the joy of helping to build.\n\nMy relationship with this origin began in 1999, in the BSCA and Cup of Excellence competitions. I am proud to have taken part in creating the competition in Brazil and in drawing up its protocols.\n\nThe property has 32 hectares, 6 of which are planted with Catuaí Vermelho and Pacamara. Altitude, a mild climate, slow ripening and a dry season favor the expression of sweet, complex and elegant coffees.\n\nAt São Benedito, excellence begins in the field, with shading, brachiaria grass cover, drip irrigation and selective picking. The selection of ripe cherries relies on the essential participation of the women on the team, followed by slow drying in greenhouses and on African beds.\n\nIn the cup, sweetness, a silky texture, balanced acidity and a long finish stand out, with notes of honey, rapadura (raw cane sugar), fruit, flowers and citrus. The naturals show body and ripe fruit flavors; the pulped naturals reveal clarity and delicacy.\n\nIn 2020, our first harvest won ABIC's 17th National Championship and stood out at auction. The following year, I took 17th place in my debut as a grower in the Cup of Excellence Brazil.\n\nIn 2026, under the leadership of Kleumon Moreira and the team, we continue to refine every stage. Certified by BSCA, the farm also aims to be a space for teaching, experimentation and knowledge sharing, strengthening the community and valuing the entire chain.\n\nOur story continues in every bloom and every cup, uniting passion, people, respect for the land and a lasting commitment to quality.", "site": "", "dir": "img/f34/", "imgs": [["01.jpg", 1400, 933], ["02.jpg", 960, 1280], ["03.jpg", 1050, 1400], ["04.jpg", 1400, 933], ["05.jpg", 1400, 815]], "cover": "01.jpg"}, {"id": "fazenda-tijuco-wet", "cat": "wet", "farm": "Fazenda Tijuco", "producer": "Túlio Xavier Pina", "region": "Chapada Diamantina", "city": "Piatã", "uf": "BA", "variety": "Arara", "procPt": "Honey", "procEn": "Honey", "alt": "1.270", "histPt": "A fazenda tijuco deu início a produção de cafés em 2018 com um sonho do produtor Tulio em ter sua chácara de café e produzir pouco mas com uma excelente qualidade , colocando nessa produção não só cafés mas também amor pelo que faz carinho e respeito aos colaboradores , são cafés produzidos em uma região de e elente qualidade de cafés com um micro clima único , grãos selecionados a dedo por mulheres que fazem a colheita, obtendo assim um café com uma bebida rara.", "histEn": "Fazenda Tijuco began producing coffee in 2018 with grower Túlio's dream of having his own small coffee farm and producing little, but with excellent quality, putting into this production not only coffee but also love for what he does, care and respect for the workers. These coffees are produced in a region of excellent coffee quality with a unique microclimate, with beans hand-selected by the women who do the harvesting, resulting in a coffee with a rare cup.", "site": "", "dir": "img/f35/", "imgs": [["01.jpg", 1400, 1050], ["03.jpg", 1050, 1400], ["04.jpg", 1400, 1050], ["05.jpg", 890, 1400]], "cover": "01.jpg"}, {"id": "fazenda-lagoa-dos-estulanos-wet", "cat": "wet", "farm": "Fazenda Lagoa dos Estulanos", "producer": "Vitor Marcelo Queiroz Barbosa", "region": "Cerrado Mineiro", "city": "Carmo do Paranaíba", "uf": "MG", "variety": "Catuaí Amarelo 62", "procPt": "Natural", "procEn": "Natural", "alt": "1.050", "histPt": "A história da D’Barbosa Coffee começou em 1980, no Cerrado Mineiro, com o propósito de produzir cafés de excelência, unindo tradição familiar, dedicação e inovação.\n\nAos 16 anos, Vitor Barbosa iniciou sua trajetória na cafeicultura ao lado de seu pai, desenvolvendo uma verdadeira paixão pelos cafés especiais. À frente da Fazenda Cachoeira, transformou essa paixão em busca constante pela qualidade e pela excelência, conquistando reconhecimento nacional e internacional, com destaque para o título de melhor café do Brasil no Cup of Excellence 2021, com 90,50 pontos.\n\nUma história de gerações que compartilham o mesmo propósito: produzir cafés extraordinários e levar a essência do Cerrado Mineiro ao mundo.", "histEn": "The story of D'Barbosa Coffee began in 1980, in the Cerrado Mineiro, with the purpose of producing excellent coffees, combining family tradition, dedication and innovation.\n\nAt 16, Vitor Barbosa began his journey in coffee growing alongside his father, developing a true passion for specialty coffee. At the helm of Fazenda Cachoeira, he turned this passion into a constant pursuit of quality and excellence, earning national and international recognition, notably the title of best coffee in Brazil in the Cup of Excellence 2021, with 90.50 points.\n\nA story of generations who share the same purpose: producing extraordinary coffees and taking the essence of the Cerrado Mineiro to the world.", "site": "", "dir": "img/f36/", "imgs": [["01.jpg", 1400, 786], ["02.jpg", 1400, 933], ["03.jpg", 1014, 680], ["04.jpg", 1004, 569], ["05.jpg", 857, 956]], "cover": "01.jpg"}, {"id": "sitio-terra-branca-wet", "cat": "wet", "farm": "Sítio Terra Branca", "producer": "Viviane Antenor Santos Mattos", "region": "Caparaó", "city": "Alto Jequitibá", "uf": "MG", "variety": "Geisha", "procPt": "Cereja Descascado", "procEn": "Pulped Natural", "alt": "1.100", "histPt": "Meu nome é Viviane, e ao lado da minha família, cultivo café especial com as próprias mãos. Para nós, a lavoura não é apenas sustento; é amor, tradição e a nossa maior paixão.\n\nNesta safra, decidimos sonhar alto. Unimos forças para produzir um lote único para o concurso de qualidade. Foram meses de cuidado sagrado: colhemos manualmente apenas os frutos maduros no topo das montanhas e cuidamos de cada etapa da seca no terreiro com a delicadeza de quem lapida um diamante.\n\nAquele lote não guarda apenas grãos perfeitos. Ele carrega o suor do trabalho familiar, a força da nossa terra e o ar puro do Caparaó. Quando embalamos essa amostra, enviamos a nossa essência em forma de xícara. Independentemente do resultado no concurso, esse lote já é o nosso maior prêmio: a prova de que a verdadeira qualidade nasce do amor que colocamos no campo.", "histEn": "My name is Viviane, and together with my family, I grow specialty coffee with my own hands. For us, the farm is not just a livelihood; it is love, tradition and our greatest passion.\n\nThis harvest, we decided to dream big. We joined forces to produce a unique lot for the quality competition. It took months of devoted care: we hand-picked only the ripe cherries at the top of the mountains and looked after every stage of patio drying with the delicacy of someone cutting a diamond.\n\nThat lot holds more than perfect beans. It carries the sweat of family work, the strength of our land and the pure air of the Caparaó. When we packed this sample, we sent our essence in the form of a cup. Whatever the result of the competition, this lot is already our greatest prize: proof that true quality is born from the love we put into the field.", "site": "", "dir": "img/f37/", "imgs": [["01.jpg", 1050, 1400], ["02.jpg", 1050, 1400], ["03.jpg", 1400, 1050], ["04.jpg", 1400, 1050]], "cover": "03.jpg"}];
const SP = {

const CAT_EN={exp:"Experimental",dry:"Dry",wet:"Wet"};
const ORDER=["exp","dry","wet"];
let lang="pt"; try{lang=localStorage.getItem("coe-lang")||"pt"}catch(e){}
let state={cat:"all",region:"",q:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const t=k=>T[lang][k];
const thumb=(d,f)=>d.dir+"t"+f, full=(d,f)=>d.dir+f;
const proc=d=>lang==="pt"?d.procPt:d.procEn;
const paras=s=>s.split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join("");
const swirl=`<img class="swirl" src="brand/swirl.png" alt="" aria-hidden="true">`;
const regua=()=>`<div class="regua">
  <div class="grp"><span>${t("real")}</span><div class="logos"><img src="sp/alliance.png" alt="Alliance for Coffee Excellence"><img src="sp/bsca_nacao.png" alt="BSCA · Cafés do Brasil"></div></div>
  <div class="grp"><span>${t("prom")}</span><div class="logos"><img class="apex" src="sp/apex.png" alt="ApexBrasil"><img src="sp/bsca.png" alt="BSCA"></div></div></div>`;

function home(){
  const regions=[...new Set(DATA.map(d=>d.region))].sort((a,b)=>a.localeCompare(b,"pt"));
  const counts=ORDER.map(c=>DATA.filter(d=>d.cat===c).length);
  const maxAlt=Math.max(...DATA.map(d=>+d.alt.replace(".","")));
  return `
  <section class="hero-w">${swirl}<div class="wrap">
    <div>
      <div class="lockup"><img src="brand/logo-gold.png" alt="Cup of Excellence Brazil 2026"><h1 class="tagline">${t("tag")}</h1></div>
      <p class="lede">${t("lede")}</p>
      <div class="facts">
        <div><b class="num">40</b><span>${t("f1")}</span></div>
        <div><b>3</b><span>${t("f2")}</span></div>
        <div><b>${regions.length}</b><span>${t("f3")}</span></div>
        <div><b class="num">${maxAlt.toLocaleString("pt-BR")} m</b><span>${t("f4")}</span></div>
      </div>
      ${regua()}
    </div>
    <aside class="paper" aria-label="${t("agenda")} ${t("oficial")}">
      <h2>${t("agenda")}<span>${t("oficial")}</span></h2>
      <ul class="agenda">${t("ag").map(([a,b,s])=>`<li class="${s}"><b>${a}</b><span>${b}</span></li>`).join("")}</ul>
      <div class="foot">${t("tag").toUpperCase()}</div>
    </aside>
  </div></section>
  <div class="tools"><div class="wrap">
    <div class="tabs" role="group" aria-label="${t("categoria")}">
      <button type="button" data-cat="all" aria-pressed="${state.cat==="all"}">${t("all")} <small>40</small></button>
      ${ORDER.map((c,i)=>`<button type="button" data-cat="${c}" aria-pressed="${state.cat===c}">${T[lang].cats[c][0]} <small>${counts[i]}</small></button>`).join("")}
    </div>
    <select id="f-region" aria-label="${t("region")}"><option value="">${t("regionAll")}</option>${regions.map(r=>`<option ${r===state.region?"selected":""}>${esc(r)}</option>`).join("")}</select>
    <input id="f-q" type="search" placeholder="${t("search")}" value="${esc(state.q)}" aria-label="${t("search")}">
    <span class="count" id="count"></span>
  </div></div>
  <div class="wrap" id="ledger"></div>
  <section class="spons" id="patrocinadores"><div class="wrap">
    <h2>${t("spH")}</h2><p class="sub">${t("spS")}</p>
    <div class="tier top">${SP.top.map(([k,f,n])=>`<div><div class="lab">${t(k)}</div><img class="${f}" src="sp/${f}.png" alt="${n}"></div>`).join("")}</div>
    <div class="tier apoio"><div class="lab">${t("apoio")}</div><div class="lgs">${SP.apoio.map(([f,n])=>`<img class="${f}" src="sp/${f}.png" alt="${n}">`).join("")}</div></div>
    <div class="tier parc"><div class="lgs">${SP.parc.map(([f,n])=>`<img class="${f}" src="sp/${f}.png" alt="${n}">`).join("")}</div></div>
  </div></section>`;
}
function ledger(){
  const q=norm(state.q.trim());
  const list=DATA.filter(d=>(state.cat==="all"||d.cat===state.cat)&&(!state.region||d.region===state.region)&&(!q||norm([d.farm,d.producer,d.city,d.region,d.variety].join(" ")).includes(q)));
  $("#count").textContent=t("shown")(list.length);
  if(!list.length){$("#ledger").innerHTML=`<p class="empty">${t("empty")}</p>`;return}
  $("#ledger").innerHTML=ORDER.filter(c=>list.some(d=>d.cat===c)).map(c=>{
    const items=list.filter(d=>d.cat===c);
    return `<section class="cat"><header><h2><small>${t("categoria")} · ${items.length}</small>${T[lang].cats[c][0]}</h2><p>${T[lang].cats[c][1]}</p></header>
    <div class="lhead cols" aria-hidden="true"><span></span><span>${t("hFarm")}</span><span>${t("hRegion")}</span><span>${t("hCity")}</span><span>${t("hVar")}</span><span>${t("hAlt")}</span><span></span></div>
    <ul class="ledger">${items.map(d=>`<li><a class="row cols" href="#${d.id}" aria-label="${esc(t("open")+": "+d.farm)}">
      <img src="${thumb(d,d.cover)}" alt="" loading="lazy">
      <span class="farm"><b>${esc(d.farm)}</b><span>${esc(d.producer)}</span><span class="meta">${esc(d.city)}, ${d.uf} · ${esc(d.variety)} · ${d.alt} m</span></span>
      <span class="k">${esc(d.region)}</span>
      <span class="k">${esc(d.city)}<small>${d.uf}</small></span>
      <span class="k">${esc(d.variety)}<small>${esc(proc(d))}</small></span>
      <span class="alt num">${d.alt}<small>${t("m")}</small></span>
      <span class="go" aria-hidden="true">→</span></a></li>`).join("")}</ul></section>`}).join("");
}
function detail(d){
  const i=DATA.indexOf(d), prev=DATA[(i+39)%40], next=DATA[(i+1)%40];
  const rel=DATA.filter(x=>x.region===d.region);
  const seen=new Set([d.farm]); const more=[...rel,...DATA.filter(x=>x.cat===d.cat)].filter(x=>!seen.has(x.farm)&&seen.add(x.farm)).slice(0,3);
  const hist=lang==="pt"?d.histPt:d.histEn;
  const gal=d.imgs.filter(x=>x[0]!==d.cover);
  const cols=gal.length===4||gal.length===2?2:gal.length===1?1:3;
  const mapq=encodeURIComponent(`${d.city}, ${d.uf}, Brasil`);
  return `<section class="d-top">${swirl}<div class="wrap">
    <nav class="crumbs"><a href="#">← ${t("back")} · ${T[lang].cats[d.cat][0]}</a>
      <span class="pn"><a href="#${prev.id}">‹ ${t("prev")}</a><a href="#${next.id}">${t("next")} ›</a></span></nav>
    <header class="d-head"><div><div class="eyebrow" style="color:#ecd29b">${T[lang].cats[d.cat][0]} · ${esc(d.region)}</div>
      <h1 style="margin-top:12px">${esc(d.farm)}</h1>
      <span class="ed">Brazil 2026 (${CAT_EN[d.cat]})</span>
      <div class="loc">${esc(d.city)}, ${d.uf}, ${t("country")}</div></div>
      <img src="brand/logo-gold.png" alt=""></header>
  </div></section>
  <div class="wrap">
    <img class="hero" src="${full(d,d.cover)}" alt="${esc(d.farm)}">
    <div class="d-grid">
      <article class="story"><h2>${t("desc")}</h2>${paras(hist)}</article>
      <aside class="rail">
        <div class="panel"><h3>${t("farmInfo")}</h3><dl>
          <dt>${t("farm")}</dt><dd>${esc(d.farm)}</dd>
          <dt>${t("farmer")}</dt><dd>${esc(d.producer)}</dd>
          <dt>${t("alt")}</dt><dd class="num">${d.alt} m</dd>
          ${d.site?`<dt>${t("site")}</dt><dd><a href="${d.site}" target="_blank" rel="noopener">${d.site.replace(/^https?:\/\//,"")}</a></dd>`:""}
        </dl></div>
        <div class="panel"><h3>${t("lotInfo")}</h3><dl>
          <dt>${t("year")}</dt><dd class="num">2026</dd>
          <dt>${t("cat")}</dt><dd>${T[lang].cats[d.cat][0]}</dd>
          <dt>${t("proc")}</dt><dd>${esc(proc(d))}</dd>
          <dt>${t("variety")}</dt><dd>${esc(d.variety)}</dd>
          <dt>${t("region")}</dt><dd>${esc(d.region)}</dd>
        </dl></div>
        <div class="panel"><h3>${t("scoreH")}</h3><div class="score"><b>—</b><p>${t("pending")}</p></div></div>
      </aside>
    </div>
    ${gal.length?`<section class="sect"><h2>${t("gallery")}</h2><div class="gal" style="--cols:${cols}">${gal.map((g,k)=>`<button type="button" data-k="${k}" aria-label="${t("gallery")} ${k+1}"><img src="${thumb(d,g[0])}" alt="${esc(d.farm)} ${k+1}" loading="lazy"></button>`).join("")}</div></section>`:""}
    <section class="sect"><h2>${t("location")}</h2><div class="locline"><span>${esc(d.city)}, ${d.uf}, ${t("country")}</span><a href="https://www.google.com/maps/search/?api=1&query=${mapq}" target="_blank" rel="noopener">${t("map")} ↗</a></div></section>
    <section class="sect"><h2>${t("also")}</h2><div class="related">${more.map(x=>`<a class="card" href="#${x.id}"><img src="${thumb(x,x.cover)}" alt="" loading="lazy"><b>${esc(x.farm)}</b><span>${T[lang].cats[x.cat][0]} · ${esc(x.city)}, ${x.uf}</span></a>`).join("")}</div></section>
  </div>`;
}
let homeScroll=0, cur=null, lbList=[], lbI=0;
function render(){
  const d=DATA.find(x=>x.id===location.hash.slice(1));
  document.documentElement.lang=lang==="pt"?"pt-BR":"en";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#foot-regua").innerHTML=regua();
  if(d){
    if(!cur) homeScroll=window.scrollY;
    $("#app").innerHTML=detail(d); document.title=`${d.farm} — Brazil 2026 (${CAT_EN[d.cat]})`; cur=d;
    lbList=d.imgs.filter(x=>x[0]!==d.cover).map(g=>full(d,g[0]));
    window.scrollTo(0,0);
  } else {
    $("#app").innerHTML=home(); ledger(); document.title="Cup of Excellence Brazil 2026";
    if(cur) window.scrollTo(0,homeScroll); cur=null;
  }
}
document.addEventListener("click",e=>{
  const lb=e.target.closest(".lang button"); if(lb){lang=lb.dataset.lang;try{localStorage.setItem("coe-lang",lang)}catch(_){}
    const y=window.scrollY, keep=cur; cur=null; render(); if(!keep) window.scrollTo(0,y); return}
  const c=e.target.closest(".tabs button"); if(c){state.cat=c.dataset.cat;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b===c));ledger();return}
  const g=e.target.closest(".gal button"); if(g){lbI=+g.dataset.k;openLb();return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="f-q"){state.q=e.target.value;ledger()}
  if(e.target.id==="f-region"){state.region=e.target.value;ledger()}
});
const dlg=$("#lb");
function openLb(){$("#lb-img").src=lbList[lbI]; if(!dlg.open) dlg.showModal()}
$("#lb-close").onclick=()=>dlg.close();
$("#lb-prev").onclick=()=>{lbI=(lbI+lbList.length-1)%lbList.length;openLb()};
$("#lb-next").onclick=()=>{lbI=(lbI+1)%lbList.length;openLb()};
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.addEventListener("keydown",e=>{if(!dlg.open)return;if(e.key==="ArrowRight")$("#lb-next").click();if(e.key==="ArrowLeft")$("#lb-prev").click()});
window.addEventListener("hashchange",render);
render();
</script>
